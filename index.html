<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14342b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carteira">
<title>Carteira</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico">
<style>
:root{--bg:#f5f3ee;--card:#fffefb;--ink:#17201c;--mut:#6b746e;--line:#e4e0d6;--acc:#14342b;--gold:#b08d57;--up:#2f7a56;--dn:#b3402a;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0f1512;--card:#161d19;--ink:#ece9e1;--mut:#8f9a93;--line:#26302b;--acc:#7fb89c;--gold:#c9a56b;--up:#6fc29a;--dn:#e0806a;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
body.bl .m{filter:blur(8px)}
.w{width:100%;max-width:1040px;margin:0 auto;padding:0 20px}
header{padding-top:18px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.lb{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut)}
.tot{font:600 32px Georgia,serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.15}
.sr{font:600 19px Georgia,serif}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
@media(prefers-color-scheme:dark){button.p{color:#0f1512}}
button.g{border:0;background:none;color:var(--mut);padding:6px 8px}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:16px;border-bottom:1px solid var(--line);scrollbar-width:none}
nav button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mut);padding:10px 14px;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--gold);font-weight:600}
main{flex:1;min-height:0;overflow:auto;padding:20px 0 28px}
.grid{display:grid;gap:14px;grid-template-columns:1.15fr 1fr}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h4{margin:0 0 12px;font:600 12px sans-serif;text-transform:uppercase;letter-spacing:.09em;color:var(--mut)}
.dn{width:150px;height:150px;transform:rotate(-90deg);flex:none}
.sum{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.lg{flex:1;min-width:200px}
.lgr{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:8px;padding:8px 6px;text-align:left}
.lgr:hover{background:var(--bg)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.lgr span.n{flex:1}.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.up{color:var(--up)}.dnc{color:var(--dn)}
.bar{height:7px;background:var(--line);border-radius:9px;overflow:hidden;margin:7px 0 4px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.bar.g i{background:var(--gold)}
.goal{margin-bottom:16px}.goal:last-child{margin:0}
.goal div.h{display:flex;justify-content:space-between;gap:8px}
.stack{display:flex;height:12px;border-radius:9px;overflow:hidden;gap:2px;margin:12px 0 10px}
.stack i{display:block;height:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:5px 12px;border-radius:99px;font-size:13px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
@media(prefers-color-scheme:dark){.chip.on{color:#0f1512}}
.row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--bg)}
.row .n{flex:1;min-width:0}.row .n b{font-weight:500}
.row .r{text-align:right}
.pg{display:flex;justify-content:center;align-items:center;gap:10px;padding-top:12px;font-size:13px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:500 11px sans-serif;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:11px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}
.sc{overflow-x:auto}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border:0}
.step .k{width:24px;height:24px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-size:12px;flex:none;margin-top:2px}
.step .n{flex:1}
.fld{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.fld label{flex:1;min-width:140px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:12px}
input,select{display:block;width:100%;margin-top:4px;font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
td input{width:76px;margin:0;padding:5px 7px;text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;margin-bottom:14px}
.seg button{border-radius:0}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
@media(prefers-color-scheme:dark){.seg button.on{color:#0f1512}}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:22px;width:min(460px,93vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{font:600 20px Georgia,serif;margin:0 0 14px}
.ac{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap}
.st{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.note{font-size:12.5px;color:var(--mut);margin-top:12px}
.emp{text-align:center;padding:36px 10px;color:var(--mut)}
</style>
</head>
<body>
<header><div class="w">
  <div class="top">
    <div><div class="lb">Patrimônio consolidado</div><div class="tot num m" id="tot"></div></div>
    <div class="acts"><button class="g" id="eye" onclick="blur_()">Ocultar valores</button><button class="g" onclick="$('dAj').showModal();ajUI()">Ajustes</button><button class="g" id="cta" onclick="$('dCt').showModal()">Conta</button><button class="p" onclick="openLan()">Novo lançamento</button></div>
  </div>
  <nav id="tabs"></nav>
</div></header>
<main><div class="w" id="v"></div></main>

<dialog id="dLan"></dialog>
<dialog id="dDet"></dialog>
<dialog id="dAj"></dialog>
<dialog id="dCt"><h3>Conta e sincronização</h3>
<div id="ctS" class="note" style="margin:0 0 12px"></div>
<label>E-mail<input id="ctE" type="email"></label><label>Senha<input id="ctP" type="password"></label>
<div id="ctM" class="note" style="color:var(--dn);margin:0 0 8px"></div>
<div class="ac"><button onclick="$('dCt').close()">Fechar</button><button onclick="auth('sair')">Sair</button><button onclick="auth('cad')">Criar conta</button><button class="p" onclick="auth('in')">Entrar</button></div></dialog>

<script type="module" src="cloud-sync.js"></script>
<script>
const KEY='carteira_v1',$=i=>document.getElementById(i);
const R=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const P=v=>(v||0).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
const N=(v,d=2)=>(v||0).toLocaleString('pt-BR',{maximumFractionDigits:d});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const iso=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S,TAB='resumo',PGN={},UID=null,SUP=false,L={},AS={v:null,d:365};
const DEF=()=>({categories:[
 {id:'acoes',label:'Ações',color:'#3B9EFF',type:'market',unit:'ação',builtIn:true},
 {id:'fiis',label:'FIIs',color:'#12D18E',type:'market',unit:'FII',builtIn:true},
 {id:'previdencia',label:'Previdência',color:'#E0B84C',type:'saldo',unit:'plano',builtIn:true,entradaLabel:'Aporte',saidaLabel:null,rendMode:'manual'},
 {id:'crypto',label:'Crypto',color:'#B14EFF',type:'market',unit:'ativo',builtIn:true},
 {id:'fgts',label:'FGTS',color:'#1EC9C9',type:'saldo',unit:'conta',builtIn:true,entradaLabel:'Depósito',saidaLabel:'Saque',rendMode:'fixed',taxaAnual:.03}],
 data:{acoes:{positions:[],history:[]},fiis:{positions:[],history:[]},previdencia:{items:[],moves:[]},crypto:{positions:[],history:[]},fgts:{items:[],moves:[]}},
 settings:{},wealthHistory:[]});
function ens(s){if(!s||!s.categories||!s.data)s=DEF();
 s.settings=Object.assign({metaAnual:50000,renda:0,aliq:27.5,metaReserva:0,livre:0,brapiTokens:[],refs:{}},s.settings||{});
 s.settings.taxas=Object.assign({cdi:14.5,selic:0,ipca:0,em:'',at:0},s.settings.taxas||{});
 s.wealthHistory=s.wealthHistory||[];return s}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=ens(S);
const cat=id=>S.categories.find(c=>c.id===id);
const isM=c=>c.type==='market';
const isRF=c=>isM(c)&&/renda|cdb|tesouro/i.test(c.label);
function items(c){const d=S.data[c.id]||{};
 if(isM(c))return(d.positions||[]).map(p=>({id:p.id,nome:p.ticker,at:p.qtd*p.precoAtual,inv:p.qtd*p.precoMedio,sub:isRF(c)?(p.reservaTipo?'Reserva de '+(p.reservaTipo==='emergencia'?'emergência':'oportunidade'):''):N(p.qtd,4)+' un · PM '+R(p.precoMedio)})).filter(x=>x.at>0||x.inv>0);
 return(d.items||[]).map(i=>{let inv=0;(d.moves||[]).filter(m=>m.itemId===i.id).forEach(m=>inv+=m.tipo==='entrada'?m.valor:-m.valor);return{id:i.id,nome:i.nome,at:i.saldoAtual||0,inv,sub:i.subtitulo||''}})}
const tot=c=>items(c).reduce((s,x)=>s+x.at,0);
const grand=()=>S.categories.reduce((s,c)=>s+tot(c),0);
function aportes(){const y=new Date().getFullYear()+'';let t=0,pg=0;
 S.categories.forEach(c=>{if(c.id==='fgts')return;const d=S.data[c.id]||{};
  if(isM(c))(d.history||[]).forEach(h=>{if(h.tipo==='compra'&&h.data.startsWith(y))t+=h.qtd*h.preco});
  else(d.moves||[]).forEach(m=>{if(m.tipo==='entrada'&&m.data.startsWith(y)){t+=m.valor;if(c.id==='previdencia')pg+=m.valor}})});return{t,pg}}
function reserva(){let at=0,meta=S.settings.metaReserva||0;
 S.categories.forEach(c=>{if(isM(c))(S.data[c.id].positions||[]).forEach(p=>{if(p.reservaTipo==='emergencia')at+=p.qtd*p.precoAtual});if(!meta&&c.metaReservaEmergencia)meta=c.metaReservaEmergencia});return{at,meta}}
const rfCat=()=>S.categories.find(isRF)||S.categories.find(isM)||S.categories[0];

async function save(){const g=grand(),h=S.wealthHistory,t=iso();
 if(h.length&&h[h.length-1].data===t)h[h.length-1].valor=g;else h.push({data:t,valor:g});if(h.length>180)h.splice(0,h.length-180);
 localStorage.setItem(KEY,JSON.stringify(S));
 if(UID&&window.CloudSync){try{SUP=true;await CloudSync.salvarNaNuvem(UID,S)}catch(e){}}
 render()}
function blur_(){document.body.classList.toggle('bl');const b=document.body.classList.contains('bl');localStorage.setItem('cb',b?1:0);$('eye').textContent=b?'Mostrar valores':'Ocultar valores'}
if(localStorage.getItem('cb')==='1')blur_();

/* ---------- Tela ---------- */
function render(){
 $('tot').innerHTML=R(grand());
 const tabs=[['resumo','Resumo'],['assist','Assistente'],...S.categories.map(c=>[c.id,c.label])];
 if(!tabs.some(t=>t[0]===TAB))TAB='resumo';
 $('tabs').innerHTML=tabs.map(t=>`<button class="${t[0]===TAB?'on':''}" onclick="go('${t[0]}')">${esc(t[1])}</button>`).join('');
 $('v').innerHTML=TAB==='resumo'?vResumo():TAB==='assist'?vAssist():vGuia(cat(TAB));
 $('cta').textContent=UID?'Sincronizado':'Conta'}
function go(t){TAB=t;render();$('v').parentNode.scrollTop=0}
function donut(sg,t){let o=0,h='';sg.forEach(s=>{const f=t?s.v/t*100:0;h+=`<circle r="15.915" cx="21" cy="21" fill="none" stroke="${s.c}" stroke-width="5" stroke-dasharray="${f} ${100-f}" stroke-dashoffset="${-o}"/>`;o+=f});
 return`<svg viewBox="0 0 42 42" class="dn"><circle r="15.915" cx="21" cy="21" fill="none" stroke="var(--line)" stroke-width="5"/>${h}</svg>`}
function vResumo(){const g=grand(),sg=S.categories.map(c=>({c:c.color,v:tot(c),n:c.label,id:c.id})).filter(s=>s.v>0).sort((a,b)=>b.v-a.v);
 const a=aportes(),rs=reserva(),s=S.settings,lim=s.renda*.12,tx=s.taxas;
 const goal=(t,v,m,note,cl)=>`<div class="goal"><div class="h"><span>${t}</span><span class="num m">${R(v)}${m?' <span class="mut">/ '+R(m)+'</span>':''}</span></div><div class="bar ${cl||''}"><i style="width:${m?Math.min(100,v/m*100):0}%"></i></div><div class="mut" style="font-size:12.5px">${note}</div></div>`;
 return`<div class="grid"><div class="card"><h4>Onde está o seu dinheiro</h4>${g?`<div class="sum">${donut(sg,g)}<div class="lg">${sg.map(x=>`<button class="lgr" onclick="go('${x.id}')"><i class="dot" style="background:${x.c}"></i><span class="n">${esc(x.n)}</span><span class="num m">${R(x.v)}</span><span class="mut num" style="width:48px;text-align:right">${P(x.v/g*100)}</span></button>`).join('')}</div></div>`:`<div class="emp">Nenhum valor registrado ainda.<br><br><button class="p" onclick="openLan()">Fazer o primeiro lançamento</button></div>`}</div>
 <div style="display:grid;gap:14px"><div class="card"><h4>Metas</h4>
 ${goal('Aportes no ano',a.t,s.metaAnual,a.t>=s.metaAnual?'Meta atingida':'Faltam '+R(Math.max(0,s.metaAnual-a.t)))}
 ${goal('PGBL dedutível',a.pg,lim,lim?'Espaço restante: '+R(Math.max(0,lim-a.pg))+' · economia estimada '+R(Math.min(a.pg,lim)*s.aliq/100):'Informe a renda anual em Ajustes','g')}
 ${rs.meta?goal('Reserva de emergência',rs.at,rs.meta,rs.at>=rs.meta?'Completa':'Faltam '+R(rs.meta-rs.at)):''}</div>
 <div class="card"><h4>Taxas de mercado</h4><div class="two"><div><div class="lb">CDI</div><b class="sr">${N(tx.cdi)}%</b></div><div><div class="lb">Selic meta</div><b class="sr">${tx.selic?N(tx.selic)+'%':'-'}</b></div></div>
 <div class="note" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span>${tx.em?'Banco Central, '+tx.em:'Sem atualização'}${tx.ipca?' · IPCA 12m '+N(tx.ipca)+'%':''}</span><button class="g" id="bt" onclick="atualizar()">Atualizar taxas e cotações</button></div></div></div></div>`}
function vGuia(c){const it=items(c).sort((a,b)=>b.at-a.at),t=it.reduce((s,x)=>s+x.at,0),inv=it.reduce((s,x)=>s+(x.inv||0),0);
 const pn=PGN[c.id]||0,per=5,pages=Math.max(1,Math.ceil(it.length/per)),pg=Math.min(pn,pages-1);
 const top=it.slice(0,5),out=it.slice(5).reduce((s,x)=>s+x.at,0);
 const seg=top.map((x,i)=>({n:x.nome,v:x.at,o:1-i*.15}));if(out>0)seg.push({n:'Outros',v:out,o:.2});
 let h=`<div class="top" style="margin-bottom:6px"><div><div class="lb">${esc(c.label)}</div><div class="tot num m">${R(t)}</div>${inv>0?`<div class="${t>=inv?'up':'dnc'} num m">${t>=inv?'+':''}${R(t-inv)} · ${P((t-inv)/inv*100)}</div>`:''}</div><button class="p" onclick="openLan('${c.id}')">Lançar em ${esc(c.label)}</button></div>`;
 if(!it.length)return h+`<div class="card emp">Nada registrado nesta guia.</div>`;
 h+=`<div class="card"><div class="stack">${seg.map(s=>`<i style="width:${s.v/t*100}%;background:${c.color};opacity:${s.o}"></i>`).join('')}</div><div class="mut" style="font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap">${seg.map(s=>`<span>${esc(s.n)} ${P(s.v/t*100)}</span>`).join('')}</div></div><div class="card" style="margin-top:14px;padding:6px 14px 14px">`;
 it.slice(pg*per,pg*per+per).forEach(x=>{const r=x.inv>0?x.at-x.inv:null;h+=`<div class="row" onclick="openDet('${c.id}','${x.id}')"><div class="n"><b>${esc(x.nome)}</b><div class="mut" style="font-size:12.5px">${esc(x.sub)}</div></div><div class="mut num" style="width:52px;text-align:right">${P(x.at/t*100)}</div><div class="r"><div class="num m">${R(x.at)}</div>${r!==null?`<div class="num m ${r>=0?'up':'dnc'}" style="font-size:12.5px">${r>=0?'+':''}${R(r)}</div>`:''}</div></div>`});
 if(pages>1)h+=`<div class="pg"><button class="g" ${pg?'':'disabled'} onclick="PGN['${c.id}']=${pg-1};render()">Anterior</button>${pg+1} de ${pages}<button class="g" ${pg<pages-1?'':'disabled'} onclick="PGN['${c.id}']=${pg+1};render()">Próxima</button></div>`;
 return h+'</div>'}

/* ---------- Assistente ---------- */
const OPS=[{k:'tes',n:'Tesouro Selic',p:99,l:'Diária',o:'Garantia do Tesouro Nacional'},{k:'cdbl',n:'CDB com liquidez diária',p:100,l:'Diária',o:'Cobertura do FGC até o limite'},{k:'cdb',n:'CDB com prazo definido',p:110,l:'No vencimento',o:'Cobertura do FGC; resgate antecipado pode não ser possível'},{k:'lci',n:'LCI / LCA',p:92,l:'Após carência',o:'Isenta de IR para pessoa física; FGC'},{k:'poup',n:'Poupança',p:0,l:'Diária',o:'Referência fixa de 0,5% ao mês'}];
const irT=d=>d<=180?.225:d<=360?.2:d<=720?.175:.15;
function ganho(v,d,o){const s=S.settings,cdi=s.taxas.cdi,pc=(s.refs[o.k]||o.p);
 const g=o.k==='poup'?v*(Math.pow(1.005,d/30.4167)-1):v*(Math.pow(1+cdi/100*pc/100,d/365)-1);
 return(o.k==='poup'||o.k==='lci')?g:g*(1-irT(d))}
function vAssist(){const s=S.settings,v=AS.v==null?(s.livre||0):AS.v,d=AS.d,a=aportes(),rs=reserva();let rest=v,st=[];
 if(rs.meta>rs.at&&rest>0){const x=Math.min(rest,rs.meta-rs.at);rest-=x;st.push(['Reserva de emergência',x,`Faltam ${R(rs.meta-rs.at)} para completar a meta da reserva. Ela tem prioridade sobre os demais objetivos.`,rfCat().id])}
 const esp=Math.max(0,s.renda*.12-a.pg);
 if(s.renda&&esp>0&&rest>0){const x=Math.min(rest,esp);rest-=x;st.push(['PGBL, para reduzir o imposto',x,`Há ${R(esp)} de espaço dedutível. Cada ${R(1000)} aportados reduzem o IR em cerca de ${R(1000*s.aliq/100)}. Vale até 31/12 e só para declaração completa.`,'previdencia'])}
 if(rest>0)st.push(['Renda fixa',rest,'Saldo para os demais aportes. Compare as alternativas abaixo conforme o prazo que você precisa.',rfCat().id]);
 const rows=OPS.map(o=>{const g=ganho(v,d,o);return{o,g,aa:v>0?(Math.pow(1+g/v,365/d)-1)*100:0}}).sort((x,y)=>y.g-x.g);
 return`<div class="grid" style="grid-template-columns:1fr"><div class="card"><h4>Dinheiro disponível para alocar</h4>
 <div class="fld"><label>Valor (R$)<input type="number" step="100" value="${v||''}" onchange="AS.v=+this.value||0;render()"></label><label>Prazo que não precisarei do dinheiro<select onchange="AS.d=+this.value;render()">${[[90,'3 meses'],[180,'6 meses'],[365,'1 ano'],[730,'2 anos'],[1095,'3 anos']].map(x=>`<option value="${x[0]}" ${x[0]===d?'selected':''}>${x[1]}</option>`).join('')}</select></label></div>
 ${v>0?st.map((x,i)=>`<div class="step"><div class="k">${i+1}</div><div class="n"><b>${x[0]}: <span class="num">${R(x[1])}</span></b><div class="mut" style="font-size:13px">${x[2]}</div></div><button onclick="openLan('${x[3]}','in','',${x[1].toFixed(2)})">Registrar</button></div>`).join('')+(a.t+v>0?`<div class="note">Com este valor, os aportes do ano chegariam a ${R(a.t+v)} de ${R(s.metaAnual)}.</div>`:''):'<div class="emp" style="padding:14px">Informe um valor para montar a ordem de alocação segundo as suas metas.</div>'}</div>
 <div class="card"><h4>Comparativo de alternativas para ${R(v)} em ${d>=365?N(d/365,1)+' ano(s)':N(d/30,0)+' meses'}</h4><div class="sc"><table><thead><tr><th>Alternativa</th><th class="r">% do CDI</th><th class="r">Ganho líquido</th><th class="r">Líquido ao ano</th><th>Liquidez</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.o.n}<div class="mut" style="font-size:12px">${r.o.o}</div></td><td class="r">${r.o.k==='poup'?'-':`<input type="number" step="1" value="${S.settings.refs[r.o.k]||r.o.p}" onchange="S.settings.refs['${r.o.k}']=+this.value;save()">`}</td><td class="r num m">${R(r.g)}</td><td class="r num">${N(r.aa)}%</td><td>${r.o.l}</td></tr>`).join('')}</tbody></table></div>
 <div class="note">Simulação com o CDI de ${N(s.taxas.cdi)}% a.a., IR regressivo já descontado (exceto LCI/LCA e poupança). Os percentuais do CDI são referências editáveis: use os que você encontrar na sua corretora. Isto não é recomendação de investimento.</div></div></div>`}

/* ---------- Lançamento ---------- */
function openLan(c,op,item,val){L={cat:c||(TAB!=='resumo'&&TAB!=='assist'?TAB:S.categories[0].id),op:op||'in',item:item||'',val:val||''};drawLan();$('dLan').showModal()}
function drawLan(){const c=cat(L.cat),m=isM(c),rf=isRF(c),d=S.data[c.id];
 const ops=m?[['in',rf?'Aplicação':'Compra'],['out',rf?'Resgate':'Venda']]:[['in',c.entradaLabel||'Entrada'],['out',c.saidaLabel||'Saída']];
 let h=`<h3>Novo lançamento</h3><div class="chips">${S.categories.map(x=>`<button class="chip ${x.id===L.cat?'on':''}" onclick="L.cat='${x.id}';L.item='';drawLan()">${esc(x.label)}</button>`).join('')}</div>
 <div class="seg">${ops.map(o=>`<button class="${L.op===o[0]?'on':''}" onclick="L.op='${o[0]}';drawLan()">${o[1]}</button>`).join('')}</div>`;
 if(m){const p=(d.positions||[]).find(x=>x.id===L.item);
  h+=`<label>${rf?'Nome (ex.: CDB Banco X 110% CDI)':'Código (ex.: PETR4)'}<input id="lT" list="dl" value="${p?esc(p.ticker):''}" autocomplete="off"><datalist id="dl">${(d.positions||[]).map(x=>`<option value="${esc(x.ticker)}">`).join('')}</datalist></label>`;
  h+=rf?`<label>Valor (R$)<input id="lV" type="number" step="0.01" value="${L.val}"></label>`:`<div class="two"><label>Quantidade<input id="lQ" type="number" step="any"></label><label>Preço unitário (R$)<input id="lP" type="number" step="0.01"></label></div>`}
 else{const its=d.items||[];
  h+=`<label>Conta<select id="lI" onchange="$('lN').style.display=this.value==='__n'?'block':'none'">${its.map(i=>`<option value="${i.id}" ${i.id===L.item?'selected':''}>${esc(i.nome)}</option>`).join('')}<option value="__n" ${its.length?'':'selected'}>Nova conta</option></select></label><label id="lN" style="display:${its.length?'none':'block'}">Nome da nova conta<input id="lT"></label><label>Valor (R$)<input id="lV" type="number" step="0.01" value="${L.val}"></label>`}
 h+=`<label>Data<input id="lD" type="date" value="${iso()}"></label><div class="ac"><button onclick="$('dLan').close()">Cancelar</button><button class="p" onclick="saveLan()">Salvar</button></div>`;
 $('dLan').innerHTML=h}
function recalc(d,pid){let q=0,pm=0;(d.history||[]).filter(h=>h.positionId===pid).sort((a,b)=>a.data.localeCompare(b.data)||a.id.localeCompare(b.id)).forEach(h=>{if(h.tipo==='compra'){const n=q+h.qtd;pm=n>0?(q*pm+h.qtd*h.preco)/n:0;q=n}else{q=Math.max(0,q-h.qtd);if(!q)pm=0}});const p=d.positions.find(x=>x.id===pid);p.qtd=q;p.precoMedio=pm}
async function saveLan(){const c=cat(L.cat),d=S.data[c.id],rf=isRF(c),data=$('lD').value,v=parseFloat($('lV')&&$('lV').value),out=L.op==='out';let q2=null;
 if(isM(c)){const t=$('lT').value.trim();let q=rf?1:parseFloat($('lQ').value),p=rf?v:parseFloat($('lP').value);
  if(!t||!(q>0)||!(p>0)||!data)return alert('Preencha todos os campos.');
  let pos=d.positions.find(x=>x.ticker.toLowerCase()===t.toLowerCase());
  if(!pos){if(out)return alert('Ativo não encontrado para venda.');pos={id:uid(),ticker:rf?t:t.toUpperCase(),qtd:0,precoMedio:0,precoAtual:p,atualizadoEm:null};d.positions.push(pos)}
  const prev=pos.qtd*pos.precoAtual;if(out&&q>pos.qtd+1e-9)return alert('Quantidade maior que a posição.');
  d.history.push({id:uid(),positionId:pos.id,tipo:out?'venda':'compra',qtd:q,preco:p,data});recalc(d,pos.id);
  if(rf&&pos.qtd>0)pos.precoAtual=Math.max(0,prev+(out?-p:p))/pos.qtd;
  if(!rf&&/^(acoes|fiis)$/.test(c.id))q2=pos}
 else{if(!(v>0)||!data)return alert('Informe valor e data.');let id=$('lI').value;
  if(id==='__n'){const n=$('lT').value.trim();if(!n)return alert('Informe o nome da conta.');id=uid();d.items.push({id,nome:n,subtitulo:'',saldoAtual:0})}
  const it=d.items.find(i=>i.id===id);d.moves.push({id:uid(),itemId:id,tipo:out?'saida':'entrada',valor:v,data});it.saldoAtual=(it.saldoAtual||0)+(out?-v:v)}
 $('dLan').close();TAB=c.id;await save();if(q2)cotar(q2)}

/* ---------- Detalhe ---------- */
function openDet(cid,id){const c=cat(cid),d=S.data[cid],m=isM(c),rf=isRF(c);let h='';
 if(m){const p=d.positions.find(x=>x.id===id),inv=p.qtd*p.precoMedio,at=p.qtd*p.precoAtual,r=at-inv;
  h=`<h3>${esc(p.ticker)}</h3><div class="st"><span>Valor atual</span><b class="num m">${R(at)}</b></div><div class="st"><span>Investido</span><span class="num m">${R(inv)}</span></div><div class="st"><span>Resultado</span><span class="num m ${r>=0?'up':'dnc'}">${r>=0?'+':''}${R(r)} (${P(inv?r/inv*100:0)})</span></div>`+(rf?`<div class="st"><span>Reserva</span><span></span></div>`:`<div class="st"><span>Quantidade · preço médio · preço atual</span><span class="num m">${N(p.qtd,4)} · ${R(p.precoMedio)} · ${R(p.precoAtual)}</span></div>`);
  if(rf)h+=`<label>Marcar como<select onchange="marca('${cid}','${id}',this.value)"><option value="">Sem marcação</option><option value="emergencia" ${p.reservaTipo==='emergencia'?'selected':''}>Reserva de emergência</option><option value="oportunidade" ${p.reservaTipo==='oportunidade'?'selected':''}>Reserva de oportunidade</option></select></label><label>Atualizar valor atual (R$)<div style="display:flex;gap:8px"><input id="dV" type="number" step="0.01" value="${at.toFixed(2)}"><button onclick="setAt('${cid}','${id}')">Salvar</button></div></label>`;
  h+=`<div class="ac"><button class="g" onclick="del('${cid}','${id}')">Excluir</button><button onclick="$('dDet').close()">Fechar</button><button onclick="$('dDet').close();openLan('${cid}','out','${id}')">${rf?'Resgatar':'Vender'}</button><button class="p" onclick="$('dDet').close();openLan('${cid}','in','${id}')">${rf?'Aplicar mais':'Comprar'}</button></div>`}
 else{const i=d.items.find(x=>x.id===id);
  h=`<h3>${esc(i.nome)}</h3><div class="st"><span>Saldo atual</span><b class="num m">${R(i.saldoAtual)}</b></div><label style="margin-top:14px">Corrigir saldo atual (R$)<div style="display:flex;gap:8px"><input id="dV" type="number" step="0.01" value="${(i.saldoAtual||0).toFixed(2)}"><button onclick="setSaldo('${cid}','${id}')">Salvar</button></div></label><div class="ac"><button class="g" onclick="del('${cid}','${id}')">Excluir</button><button onclick="$('dDet').close()">Fechar</button><button class="p" onclick="$('dDet').close();openLan('${cid}','in','${id}')">${esc(c.entradaLabel||'Entrada')}</button></div>`}
 $('dDet').innerHTML=h;$('dDet').showModal()}
function marca(c,id,v){const p=S.data[c].positions.find(x=>x.id===id);if(v)p.reservaTipo=v;else delete p.reservaTipo;save()}
function setAt(c,id){const v=parseFloat($('dV').value),p=S.data[c].positions.find(x=>x.id===id);if(!(v>=0)||!p.qtd)return;p.precoAtual=v/p.qtd;$('dDet').close();save()}
function setSaldo(c,id){const v=parseFloat($('dV').value);if(!(v>=0))return;S.data[c].items.find(x=>x.id===id).saldoAtual=v;$('dDet').close();save()}
function del(cid,id){if(!confirm('Excluir este item e o histórico dele?'))return;const d=S.data[cid];
 if(isM(cat(cid))){d.positions=d.positions.filter(x=>x.id!==id);d.history=d.history.filter(x=>x.positionId!==id)}else{d.items=d.items.filter(x=>x.id!==id);d.moves=d.moves.filter(x=>x.itemId!==id)}
 $('dDet').close();save()}

/* ---------- Ajustes ---------- */
function ajUI(){const s=S.settings,f=(i,t,v,st)=>`<label>${t}<input id="${i}" type="number" step="${st||1}" value="${v||''}"></label>`;
 $('dAj').innerHTML=`<h3>Ajustes</h3>${f('aM','Meta anual de aportes (R$)',s.metaAnual,100)}${f('aR','Renda bruta tributável anual (R$), para o limite do PGBL',s.renda,100)}<div class="two">${f('aA','Alíquota marginal de IR (%)',s.aliq,.5)}${f('aE','Meta da reserva de emergência (R$)',s.metaReserva,100)}</div>${f('aL','Valor que costuma ficar disponível (R$)',s.livre,100)}<label>Chaves da API de cotações (separadas por vírgula)<input id="aT" value="${esc((s.brapiTokens||[]).join(','))}"></label>
 <div class="ac" style="justify-content:flex-start"><button onclick="exp()">Exportar backup</button><button onclick="$('aF').click()">Importar backup</button><input id="aF" type="file" accept=".json" hidden onchange="imp(this)"></div>
 <div class="ac" style="margin-top:14px"><button onclick="$('dAj').close()">Cancelar</button><button class="p" onclick="ajSave()">Salvar</button></div>`}
function ajSave(){const s=S.settings,g=i=>parseFloat($(i).value)||0;Object.assign(s,{metaAnual:g('aM'),renda:g('aR'),aliq:g('aA'),metaReserva:g('aE'),livre:g('aL'),brapiTokens:$('aT').value.split(',').map(x=>x.trim()).filter(Boolean)});AS.v=null;$('dAj').close();save()}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='carteira-backup-'+iso()+'.json';a.click()}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.categories)throw 0;if(!confirm('Substituir os dados atuais pelo backup?'))return;S=ens(d);$('dAj').close();save()}catch(e){alert('Arquivo de backup inválido.')}};r.readAsText(f)}

/* ---------- Web: taxas e cotações ---------- */
async function bcb(s){const r=await fetch(`https://api.bcb.gov.br/dados/serie/bcdata.sgs.${s}/dados/ultimos/1?formato=json`);return parseFloat((await r.json())[0].valor)}
async function taxas(){try{const[cdi,selic,ipca]=await Promise.all([bcb(4389),bcb(432),bcb(13522)]);Object.assign(S.settings.taxas,{cdi,selic,ipca,at:Date.now(),em:new Date().toLocaleDateString('pt-BR')});return true}catch(e){return false}}
async function quote(t){const k=S.settings.brapiTokens||[],pool=k.length?[...k].sort(()=>Math.random()-.5):[null];
 for(const x of pool){try{const r=await fetch('https://brapi.dev/api/quote/'+t+(x?'?token='+encodeURIComponent(x):''));if(!r.ok)continue;const j=(await r.json()).results[0];if(j&&j.regularMarketPrice)return j.regularMarketPrice}catch(e){}}return null}
async function cotar(p){const v=await quote(p.ticker);if(v){p.precoAtual=v;p.atualizadoEm=new Date().toISOString();save()}}
async function atualizar(){const b=$('bt');if(b){b.disabled=true;b.textContent='Atualizando...'}
 const ok=await taxas();for(const id of['acoes','fiis']){const c=cat(id);if(!c)continue;for(const p of S.data[id].positions||[]){const v=await quote(p.ticker);if(v){p.precoAtual=v;p.atualizadoEm=new Date().toISOString()}}}
 await save();if(!ok)alert('Não foi possível consultar o Banco Central agora.')}

/* ---------- Conta ---------- */
async function auth(a){const e=$('ctE').value.trim(),p=$('ctP').value,m=$('ctM');m.textContent='';
 if(!window.CloudSync){m.textContent='Sincronização ainda carregando. Tente novamente.';return}
 try{if(a==='sair'){await CloudSync.logout();$('dCt').close();return}if(a==='in')await CloudSync.login(e,p);else await CloudSync.cadastrar(e,p);$('dCt').close()}catch(x){m.textContent='Não foi possível concluir. Verifique e-mail e senha.'}}
window.addEventListener('cloudsync-pronto',()=>{CloudSync.onAuthStateChanged(async u=>{if(CloudSync.pararDeOuvir)CloudSync.pararDeOuvir();
 if(u){UID=u.uid;$('ctS').textContent='Conectado como '+u.email;const n=await CloudSync.buscarDaNuvem(u.uid).catch(()=>null);if(n)S=ens(n);else await save();render();
  CloudSync.ouvirMudancas(u.uid,d=>{if(SUP){SUP=false;return}S=ens(d);localStorage.setItem(KEY,JSON.stringify(S));render()})}
 else{UID=null;$('ctS').textContent='Dados salvos apenas neste aparelho.';render()}})});
$('ctS').textContent='Dados salvos apenas neste aparelho.';
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
if(!S.settings.taxas.at||Date.now()-S.settings.taxas.at>432e5)taxas().then(ok=>ok&&save());
</script>
