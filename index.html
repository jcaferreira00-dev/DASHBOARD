<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14342b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Carteira" />
    <title>Carteira</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" href="favicon.ico" />
    <style>
      :root {
        --bg: #f5f3ee;
        --card: #fffefb;
        --ink: #17201c;
        --mut: #6b746e;
        --line: #e4e0d6;
        --acc: #14342b;
        --gold: #b08d57;
        --up: #2f7a56;
        --dn: #b3402a;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1512;
          --card: #161d19;
          --ink: #ece9e1;
          --mut: #8f9a93;
          --line: #26302b;
          --acc: #7fb89c;
          --gold: #c9a56b;
          --up: #6fc29a;
          --dn: #e0806a;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.45 -apple-system,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
        display: flex;
        flex-direction: column;
        padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
      }
      body.bl .m {
        filter: blur(8px);
      }
      .w {
        width: 100%;
        max-width: 1040px;
        margin: 0 auto;
        padding: 0 20px;
      }
      header {
        padding-top: 18px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 12px;
        flex-wrap: wrap;
      }
      .lb {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--mut);
      }
      .tot {
        font:
          300 46px/1.05 "SF Pro Display",
          "Segoe UI Variable Display",
          "Segoe UI",
          "Helvetica Neue",
          Arial,
          sans-serif;
        letter-spacing: -0.035em;
        font-variant-numeric: lining-nums tabular-nums;
        margin-top: 2px;
      }
      .cu {
        font-size: 0.36em;
        font-weight: 500;
        letter-spacing: 0.06em;
        color: var(--mut);
        margin-right: 0.45em;
        vertical-align: 0.95em;
      }
      .ce {
        font-size: 0.42em;
        font-weight: 400;
        color: var(--mut);
        letter-spacing: 0;
      }
      @media (max-width: 520px) {
        .tot {
          font-size: 38px;
        }
      }
      .sr {
        font:
          500 22px/1.2 -apple-system,
          "Segoe UI",
          Arial,
          sans-serif;
        letter-spacing: -0.02em;
        font-variant-numeric: lining-nums tabular-nums;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        border-radius: 8px;
        padding: 8px 14px;
      }
      button.p {
        background: var(--acc);
        border-color: var(--acc);
        color: #fff;
      }
      @media (prefers-color-scheme: dark) {
        button.p {
          color: #0f1512;
        }
      }
      button.g {
        border: 0;
        background: none;
        color: var(--mut);
        padding: 6px 8px;
      }
      .acts {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      .ib {
        width: 36px;
        height: 36px;
        padding: 0;
        display: inline-grid;
        place-items: center;
        border: 0;
        background: none;
        color: var(--mut);
        border-radius: 8px;
      }
      .ib:hover {
        background: var(--bg);
        color: var(--ink);
      }
      .ib.d:hover {
        color: var(--dn);
      }
      .ib.on {
        color: var(--acc);
      }
      .ib:disabled {
        opacity: 0.3;
        cursor: default;
      }
      .ib.p {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--acc);
        color: #fff;
      }
      @media (prefers-color-scheme: dark) {
        .ib.p {
          color: #0f1512;
        }
      }
      svg.i,
      .ib svg,
      .icn svg {
        width: 19px;
        height: 19px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        transform: none;
      }
      .icn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .icn span {
        display: inline-flex;
      }
      .ib.wr {
        color: var(--gold);
      }
      .sw,
      .ck input.tg {
        appearance: none;
        -webkit-appearance: none;
        position: relative;
        width: 34px;
        height: 20px;
        padding: 0;
        margin: 0;
        border-radius: 99px;
        background: var(--line);
        border: 0;
        cursor: pointer;
        flex: none;
        transition: background 0.2s;
      }
      .sw::after,
      .ck input.tg::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: left 0.2s;
      }
      .sw.on,
      .ck input.tg:checked {
        background: var(--acc);
      }
      .sw.on::after,
      .ck input.tg:checked::after {
        left: 16px;
      }
      .lgr.sel {
        background: var(--bg);
        font-weight: 600;
      }
      .ck {
        display: flex;
        gap: 8px;
        align-items: center;
        color: var(--ink);
        font-size: 14px;
      }
      .ck input {
        width: auto;
        margin: 0;
      }
      .inl {
        display: inline-block;
        width: 104px;
        margin: 0;
        padding: 3px 6px;
        text-align: right;
        font-size: 16px;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 6px;
      }
      .inl:hover,
      .inl:focus {
        border-color: var(--line);
        background: var(--bg);
        outline: 0;
      }
      .three {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .chip svg.i {
        width: 12px;
        height: 12px;
        margin-left: 4px;
        vertical-align: -1px;
      }
      .dh {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }
      .dh h3 {
        margin: 0;
      }
      nav {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        margin-top: 16px;
        border-bottom: 1px solid var(--line);
        scrollbar-width: none;
      }
      nav button {
        border: 0;
        border-bottom: 2px solid transparent;
        border-radius: 0;
        background: none;
        color: var(--mut);
        padding: 10px 14px;
        white-space: nowrap;
      }
      nav button.on {
        color: var(--ink);
        border-color: var(--gold);
        font-weight: 600;
      }
      @media (max-width: 760px) {
        main .kp {
          grid-template-columns: 1fr 1fr;
          gap: 10px;
        }
        main .kpi {
          padding: 14px;
        }
        main .three > div {
          display: flex;
          flex-direction: column;
          justify-content: space-between;
        }
        main .dcv {
          white-space: nowrap;
        }
        main .kv,
        main .sr {
          display: block;
          white-space: nowrap;
          overflow-wrap: normal;
        }
      }
      .pgs {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
      }
      .pgs::-webkit-scrollbar {
        display: none;
      }
      .pgs > section {
        flex: 0 0 100%;
        min-width: 0;
        scroll-snap-align: start;
        display: grid;
        gap: 14px;
      }
      .pgs > section > .kp {
        margin-bottom: 0;
      }
      .pgd {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 14px;
      }
      .pgd i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--line);
      }
      .pgd i.on {
        background: var(--gold);
      }
      /* Celular: o cabeçalho encolhe junto com a rolagem (--p vai de 0 a 1), sem saltos. */
      :root {
        --p: 0;
      }
      @media (max-width: 760px) {
        header {
          padding-top: calc(18px - 10px * var(--p));
        }
        header .top {
          display: flex;
          flex-wrap: nowrap;
          align-items: flex-start;
          justify-content: space-between;
          gap: 10px;
          margin-bottom: calc(var(--hd0, 0) * -1px * var(--p));
        }
        header .top > div:first-child {
          min-width: 0;
          flex: 1 1 auto;
        }
        header .top .lb {
          font-size: 10px;
          letter-spacing: 0.06em;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          opacity: calc(1 - var(--p) * 1.8);
        }
        header .top .tot {
          white-space: nowrap;
          transform-origin: 0 0;
          transform: translateY(calc(var(--dyt, 0) * 1px * var(--p)))
            scale(calc(1 + (var(--s, 1) - 1) * var(--p)));
        }
        header .acts {
          flex: none;
          flex-wrap: nowrap;
          gap: 4px;
          margin-top: 7px;
          transform-origin: 100% 50%;
          transform: translateY(calc(var(--dy, 0) * 1px * var(--p))) scale(calc(1 - 0.2 * var(--p)));
        }
        header #cta {
          display: none;
        }
        header .acts .icn {
          width: 42px;
          height: 42px;
          padding: 0;
          gap: 0;
          justify-content: center;
        }
        header .acts .icn svg {
          width: 22px;
          height: 22px;
        }
        header .acts .icn {
          transform: translateY(calc(7px * (1 - var(--p))));
        }
        header .acts .icn .lt {
          display: none;
        }
        #cfg {
          position: relative;
        }
        #cfg.sy::after {
          content: "";
          position: absolute;
          top: 5px;
          right: 5px;
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: var(--gold);
        }
        header nav {
          margin-top: calc(16px - 10px * var(--p));
        }
        header nav.mob button {
          padding-top: calc(12px - 4px * var(--p));
          padding-bottom: calc(12px - 4px * var(--p));
        }
        main {
          padding-bottom: calc(28px + var(--hd, 0) * 1px);
        }
      }
      nav.mob {
        gap: 0;
        overflow-x: hidden;
      }
      nav.mob button {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px 0;
      }
      nav.mob button svg.i {
        width: 22px;
        height: 22px;
      }
      main {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 20px 0 28px;
      }
      .grid {
        display: grid;
        gap: 14px;
        grid-template-columns: 1.15fr 1fr;
      }
      @media (max-width: 760px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px;
      }
      .card h4 {
        margin: 0 0 12px;
        font: 600 12px sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--mut);
      }
      .dnw {
        position: relative;
        width: 200px;
        height: 200px;
        flex: none;
      }
      .dn {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }
      .dn circle {
        transition: opacity 0.2s;
        cursor: pointer;
      }
      .dc {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        text-align: center;
        pointer-events: none;
        padding: 0 34px;
      }
      .dcv {
        font:
          300 24px/1.2 "SF Pro Display",
          "Segoe UI Variable Display",
          "Segoe UI",
          "Helvetica Neue",
          Arial,
          sans-serif;
        letter-spacing: -0.03em;
        font-variant-numeric: lining-nums tabular-nums;
      }
      .dc .lb {
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .kp {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        margin-bottom: 14px;
      }
      .kpi {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px 18px;
        cursor: pointer;
        transition:
          transform 0.15s,
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .kpi:hover {
        transform: translateY(-2px);
        border-color: var(--gold);
        box-shadow: 0 10px 26px -16px rgba(0, 0, 0, 0.45);
      }
      .kv {
        font:
          400 25px/1.2 -apple-system,
          "Segoe UI",
          Arial,
          sans-serif;
        letter-spacing: -0.02em;
        margin: 5px 0 2px;
        font-variant-numeric: lining-nums tabular-nums;
      }
      .kpi .bar {
        margin: 8px 0 6px;
      }
      .ins {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 14px 4px;
        border-bottom: 1px solid var(--line);
      }
      .ins:last-child {
        border: 0;
      }
      .ins .dot {
        margin-top: 7px;
      }
      .ins.alerta .dot {
        background: var(--gold);
      }
      .ins.info .dot {
        background: var(--mut);
      }
      .ins.ok .dot {
        background: var(--up);
      }
      .ins .n {
        flex: 1;
        min-width: 0;
      }
      .ins .n div {
        font-size: 13px;
        color: var(--mut);
        margin-top: 2px;
      }
      .sum {
        display: flex;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
      }
      .lg {
        flex: 1;
        min-width: 200px;
      }
      .lgr {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        border: 0;
        background: none;
        border-radius: 8px;
        padding: 8px 6px;
        text-align: left;
      }
      .lgr:hover {
        background: var(--bg);
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex: none;
      }
      .lgr span.n {
        flex: 1;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      .mut {
        color: var(--mut);
      }
      .up {
        color: var(--up);
      }
      .dnc {
        color: var(--dn);
      }
      .bar {
        height: 7px;
        background: var(--line);
        border-radius: 9px;
        overflow: hidden;
        margin: 7px 0 4px;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--acc);
        border-radius: 9px;
      }
      .bar.g i {
        background: var(--gold);
      }
      .goal {
        margin-bottom: 16px;
      }
      .goal:last-child {
        margin: 0;
      }
      .goal div.h {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .stack {
        display: flex;
        height: 12px;
        border-radius: 9px;
        overflow: hidden;
        gap: 2px;
        margin: 12px 0 10px;
      }
      .stack i {
        display: block;
        height: 100%;
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .chip {
        padding: 5px 12px;
        border-radius: 99px;
        font-size: 13px;
      }
      .chip.on {
        background: var(--acc);
        color: #fff;
        border-color: var(--acc);
      }
      @media (prefers-color-scheme: dark) {
        .chip.on {
          color: #0f1512;
        }
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 4px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
      }
      .row:hover {
        background: var(--bg);
      }
      .row .n {
        flex: 1;
        min-width: 0;
      }
      .row .n b {
        font-weight: 500;
      }
      .row .r {
        text-align: right;
      }
      .pg {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        padding-top: 12px;
        font-size: 13px;
        color: var(--mut);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th {
        text-align: left;
        font: 500 11px sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--mut);
        padding: 6px 8px;
        border-bottom: 1px solid var(--line);
      }
      td {
        padding: 11px 8px;
        border-bottom: 1px solid var(--line);
        font-variant-numeric: tabular-nums;
      }
      td.r,
      th.r {
        text-align: right;
      }
      .sc {
        overflow-x: auto;
      }
      .step {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .step:last-child {
        border: 0;
      }
      .step .k {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 1px solid var(--gold);
        color: var(--gold);
        display: grid;
        place-items: center;
        font-size: 12px;
        flex: none;
        margin-top: 2px;
      }
      .step .n {
        flex: 1;
      }
      .fld {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .fld label {
        flex: 0 1 240px;
        min-width: 140px;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--mut);
        margin-bottom: 12px;
      }
      input,
      select {
        display: block;
        width: 100%;
        margin-top: 4px;
        font: inherit;
        font-size: 16px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg);
        color: var(--ink);
      }
      td input {
        width: 76px;
        margin: 0;
        padding: 5px 7px;
        text-align: right;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .seg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        margin-bottom: 14px;
      }
      .seg button {
        border-radius: 0;
      }
      .seg button:first-child {
        border-radius: 8px 0 0 8px;
      }
      .seg button:last-child {
        border-radius: 0 8px 8px 0;
      }
      .seg button.on {
        background: var(--acc);
        color: #fff;
        border-color: var(--acc);
      }
      @media (prefers-color-scheme: dark) {
        .seg button.on {
          color: #0f1512;
        }
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--card);
        color: var(--ink);
        padding: 22px;
        width: min(460px, 93vw);
        max-height: 92vh;
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.5);
      }
      dialog h3 {
        font:
          600 20px Georgia,
          serif;
        margin: 0 0 14px;
      }
      .ac {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 6px;
        flex-wrap: wrap;
      }
      .st {
        display: flex;
        justify-content: space-between;
        padding: 7px 0;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
      }
      .note {
        font-size: 12.5px;
        color: var(--mut);
        margin-top: 12px;
      }
      .emp {
        text-align: center;
        padding: 36px 10px;
        color: var(--mut);
      }
      .bdg {
        display: inline-block;
        min-width: 18px;
        padding: 0 6px;
        margin-left: 6px;
        border-radius: 99px;
        background: var(--gold);
        color: #fff;
        font-size: 11px;
        line-height: 18px;
        text-align: center;
      }
      .tag {
        font-size: 11px;
        border: 1px solid var(--gold);
        color: var(--gold);
        border-radius: 99px;
        padding: 1px 8px;
        margin-left: 4px;
        white-space: nowrap;
      }
      .ins.crit .dot {
        background: var(--dn);
      }
      #dMt {
        width: min(540px, 94vw);
      }
      .sw:not(.on) {
        box-shadow: inset 0 0 0 1px var(--mut);
      }
      /* ---- ajuste mobile: sem rolagem lateral e com margens ---- */
      html {
        -webkit-text-size-adjust: 100%;
      }
      main {
        overflow-x: hidden;
      }
      .three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .three > *,
      .two > *,
      .grid > *,
      .kp > *,
      .row .n {

      const KEY = "carteira_v1",
        $ = (i) => document.getElementById(i);
      const R = (v) => (v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
      const P = (v) =>
        (v || 0).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) +
        "%";
      const N = (v, d = 2) => (v || 0).toLocaleString("pt-BR", { maximumFractionDigits: d });
      const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const iso = () => new Date().toISOString().slice(0, 10);
      const esc = (s) =>
        String(s == null ? "" : s).replace(
          /[&<>"]/g,

      /* ---------- Campos numéricos (formatação ao digitar) ---------- */
      // Campos com o atributo data-m mostram o número no padrão brasileiro enquanto você
      // digita: 1500000 vira 1.500.000 e a vírgula separa os centavos (um ponto digitado
      // também vira vírgula). Para LER o valor de um campo use num(); numN() devolve NaN
      // quando o campo está vazio. setV(id, n) preenche um campo já formatado.
      const num = (v) => {
        if (typeof v === "number") return isFinite(v) ? v : 0;
        const n = parseFloat(
          String(v == null ? "" : v)
            .replace(/\./g, "")
            .replace(",", "."),
        );
        return isFinite(n) ? n : 0;
      };
      const numN = (v) => (String(v == null ? "" : v).trim() === "" ? NaN : num(v));
      const fnum = (v) => {
        const n = typeof v === "number" ? v : parseFloat(String(v == null ? "" : v));
        if (!isFinite(n)) return "";
        return n.toLocaleString(
          "pt-BR",
          Number.isInteger(n)
            ? { maximumFractionDigits: 0 }
            : { minimumFractionDigits: 2, maximumFractionDigits: 8 },
        );
      };
      const setV = (id, n) => ($(id).value = fnum(n));
      function mFmt(el, ev) {
        let s = el.value;
        const p = el.selectionStart == null ? s.length : el.selectionStart;
        if (ev && ev.data === "." && s[p - 1] === ".") s = s.slice(0, p - 1) + "," + s.slice(p);
        let sig = s.slice(0, p).replace(/[^\d,]/g, "").length;
        const parts = s.replace(/[^\d,]/g, "").split(",");
        let ip = parts[0].replace(/^0+(?=\d)/, "");
        const hasC = parts.length > 1;
        if (hasC && ip === "") {
          ip = "0";
          sig++;
        }
        let out = ip.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        if (hasC) out += "," + parts.slice(1).join("").slice(0, 8);
        if (out === el.value) return;
        el.value = out;
        let pos = out.length;
        if (sig <= 0) pos = 0;
        else {
          let c = 0;
          for (let i = 0; i < out.length; i++) {
            if (/[\d,]/.test(out[i]) && ++c === sig) {
              pos = i + 1;
              break;
            }
          }
        }
        try {
          el.setSelectionRange(pos, pos);
        } catch (e) {}
      }

        "input",
        (e) => {
          const t = e.target;
          if (t && t.matches && t.matches("input[data-m]") && !e.isComposing) mFmt(t, e);
        },
        true,
      );
      document.addEventListener(
        "paste",
        (e) => {
          const el = e.target;

      const mInit = (n) => {

      /* ---------- Assistente: caixa para uma oportunidade ---------- */
      function simCaixa(X) {
        const s = S.settings,
          p = posList(),
          src = [],
          pf = (x) => /prefixad|pr[eé]-?fix|\bltn\b|ntn-?f/i.test(x.nome);
        if (s.livre > 0)
          src.push({
            n: "Caixa já disponível",
            net: s.livre,
            tax: 0,
            k: 0,
            nt: "Sem custo",
            pl: null,
            r: 0,
          });
        const ok = (x) => !lock(x),
          mk = (x, k, nt) => {
            const f = fr(x),
              a = x.at * f,
              pl = x.pl * f,
              tx = Math.max(0, pl) * x.ir;
            return {
              n: x.nome + (f < 1 ? " (" + N(f * 100, 0) + "% resgatável)" : ""),
              net: a - tx,
              tax: tx,
              k,
              nt,
              r: a ? tx / a : 0,
              pp: x.pp,
              pl: x.inv > 0 ? pl : null,
              cid: x.cid,
              id: x.id,
              rf: x.rf,
              res: x.res,
            };
          };
        p.filter((x) => x.rf && !x.res && ok(x) && !pf(x))
          .map((x) =>
            mk(
              x,
              1,
              "Pós-fixado: o líquido já desconta o IR sobre o lucro; confira carência e liquidez",
            ),
          )
          .sort((a, b) => a.r - b.r)
          .forEach((x) => src.push(x));
        p.filter((x) => !x.rf && x.pl >= 0 && ok(x))
          .map((x) =>
            mk(
              x,
              2,
              x.pl > 0
                ? "IR estimado sobre o ganho (pode haver isenção em vendas de ações até R$ 20 mil no mês)"
                : "Sem ganho a tributar",
            ),
          )
          .sort((a, b) => a.r - b.r)
          .forEach((x) => src.push(x));
        all()
          .filter((x) => !isM(cat(x.cid)) && x.disp != null && x.at > 0 && !lock(x))
          .forEach((x) =>
            src.push({
              n: x.nome + " (" + N(fr(x) * 100, 0) + "% resgatável)",
              net: x.at * fr(x),
              tax: 0,
              k: 2,
              nt: "Sem IR estimado: confira as regras do plano",
              pl: x.inv > 0 ? (x.at - x.inv) * fr(x) : null,
              r: 0,
            }),
          );
        p.filter((x) => !x.rf && x.pl < 0 && ok(x))
          .map((x) => mk(x, 3, "Realiza prejuízo de " + R(-x.pl)))
          .sort((a, b) => b.pp - a.pp)
          .forEach((x) => src.push(x));
        p.filter((x) => x.rf && x.res && ok(x) && !pf(x))
          .map((x) => mk(x, 4, "Parte da reserva de emergência"))
          .forEach((x) => src.push(x));
        const bl = all()
            .filter((x) => x.at > 0 && lock(x))
            .map((x) => ({
              n: x.nome,
              v: x.at * fr(x),
              cl: x.cl,
              w: lock(x) === "cond" ? x.cond : "Libera em " + dtb(x.lib),
            })),
          pre = p.filter((x) => x.rf && pf(x));
        {
          const lk = [];
          all()
            .filter((x) => x.at > 0 && lock(x))
            .forEach((x) => {
              const f = fr(x),
                a = x.at * f,
                mkt = isM(cat(x.cid)),
                pl = x.inv > 0 ? (x.at - x.inv) * f : null,
                ir = /fii|imobili/i.test(x.cid + " " + x.cl) ? 0.2 : 0.15,
                tx = mkt && pl > 0 ? pl * ir : 0;
              lk.push({
                n: x.nome + (f < 1 ? " (" + N(f * 100, 0) + "% resgatável)" : ""),
                net: a - tx,
                tax: tx,
                k: 5,
                nt:
                  (lock(x) === "cond" ? x.cond : "Libera em " + dtb(x.lib)) +
                  (mkt
                    ? ": vender antes pode perder o benefício, além do IR"
                    : ": resgatar fora da regra pode ter perda; confirme com a instituição"),
                pl,
                r: a ? tx / a : 0,
                cid: x.cid,
                id: x.id,
                rf: false,
              });
            });
          lk.sort((a, b) => a.r - b.r).forEach((x) => src.push(x));
        }
        let rest = X;
        src.forEach((x) => {
          x.use = Math.min(Math.max(0, x.net), rest);
          rest -= x.use;
          x.t2 = x.net > 0 ? (x.tax * x.use) / x.net : 0;
        });
        return { src, rest: Math.max(0, rest), bl, pre };
      }

      function cxRes() {

        const r = simCaixa(X),

        x.setTransform(dpr, 0, 0, dpr, 0, 0);
        x.clearRect(0, 0, w, h);
        x.globalCompositeOperation = "lighter";
        const cx = w / 2,
          cy = h / 2,
          R = w * 0.44,
          ay = t * 0.00016,
          ax = 0.42 + Math.sin(t * 0.00007) * 0.12,
          sy = Math.sin(ay),
          cyy = Math.cos(ay),
          sx = Math.sin(ax),
          cxx = Math.cos(ax),
          rot = (px, py, pz) => {
            const x1 = px * cyy + pz * sy,
              z1 = -px * sy + pz * cyy,
              y2 = py * cxx - z1 * sx,
              z2 = py * sx + z1 * cxx;
            return [x1, y2, z2];
          };
        // brilho central
        const gr = x.createRadialGradient(cx, cy, 0, cx, cy, R * 1.05);
        gr.addColorStop(0, "rgba(255,190,70,.20)");
        gr.addColorStop(0.55, "rgba(255,150,30,.07)");

        HOLO.arcs.forEach((a) => {
          const sa = Math.sin(a.tx + t * 0.00004 * a.sp * 8),
            ca = Math.cos(a.tx + t * 0.00004 * a.sp * 8),
            sb = Math.sin(a.tz),
            cb = Math.cos(a.tz),
            st = a.from + t * 0.0003 * a.sp * 3,
            seg = 46;

          for (let i = 0; i <= seg; i++) {

      const ymd = (d) =>

        const t = new Date(),

          m = t.getMonth(),

        let d = new Date(y, m, Math.min(+sv, cl(y, m)));

      }
      /* ---------- Conta ---------- */
      async function auth(a) {
        const e = $("ctE").value.trim(),
          p = $("ctP").value,
          m = $("ctM");
        m.textContent = "";
        if (!window.CloudSync) {
          m.textContent = "Sincronização ainda carregando. Tente novamente.";
          return;
        }
        try {
          if (a === "sair") {
            await CloudSync.logout();
            $("dCt").close();
            return;
          }
          if (a === "in") await CloudSync.login(e, p);
          else await CloudSync.cadastrar(e, p);
          $("dCt").close();
        } catch (x) {
          m.textContent = "Não foi possível concluir. Verifique e-mail e senha.";
        }
      }
      let erroSync = null,
        sk = 0,
        pend = false,
        st = "local",
        lastSync = 0,
        pt,
        nuvemOk = false,
        pushing = false,
        pushAgain = false,
        falhas = 0;
      /* ---------- Sincronização com a nuvem ---------- */
      const clk = () => Math.max(Date.now() + sk, (S.updatedAt || 0) + 1);
      function stUI() {
        const b = $("cta");
        if (!b) return;
        const t = {
          ok:
            "Sincronizado" +
            (lastSync
              ? " às " +
                new Date(lastSync).toLocaleTimeString("pt-BR", {
                  hour: "2-digit",
                  minute: "2-digit",
                })
              : ""),
          pend: "Sincronização pendente",
          off: "Sem conexão: alterações guardadas neste aparelho",
          err:
            "Falha ao sincronizar, nova tentativa em instantes" +
            (erroSync
              ? " [" + ((erroSync.code || erroSync.message || "erro") + "").slice(0, 80) + "]"
              : ""),
          local: "Dados salvos apenas neste aparelho",
        };
        b.title = t[st];
        b.classList.toggle("on", st === "ok");
        b.classList.toggle("wr", st === "pend" || st === "off" || st === "err");
        const cf = $("cfg");
        if (cf) {
          cf.classList.toggle("sy", st === "pend" || st === "off" || st === "err");
          if (MOB()) cf.title = "Ajustes e perfil · " + t[st];
        }
      }
      function setSt(x) {
        st = x;
        stUI();
      }
      function push() {
        clearTimeout(pt);
        pt = setTimeout(doPush, 400);
      }
      // Só envia depois de ter confirmado o que existe na nuvem (nuvemOk): assim uma leitura que
      // falhou nunca é confundida com "nuvem vazia" e não sobrescreve a carteira.
      // Um envio por vez; se algo mudar durante o envio, envia de novo em seguida.
      // Em caso de erro, tenta de novo com espera crescente (5s, 10s, 20s... até 60s).
      async function doPush() {
        if (!UID || !window.CloudSync || !pend) return;
        if (!navigator.onLine) return setSt("off");
        if (!nuvemOk) {
          pull();
          return;
        }
        if (pushing) {
          pushAgain = true;
          return;
        }
        pushing = true;
        const v = S.updatedAt;
        try {
          await CloudSync.salvarNaNuvem(UID, paraNuvem(S));
          if (S.updatedAt === v) pend = false;
          lastSync = Date.now();
          falhas = 0;
          setSt(pend ? "pend" : "ok");
        } catch (e) {
          erroSync = e;
          console.error("sync envio", e);
          falhas++;
          setSt("err");
          clearTimeout(pt);
          pt = setTimeout(doPush, Math.min(60000, 5000 * 2 ** Math.min(falhas - 1, 4)));
        } finally {
          pushing = false;
          if (pushAgain) {
            pushAgain = false;
            push();
          }
        }
      }
      function remote(d, login) {
        fiadoCapt(d);
        d = ens(own(d));
        DERIV.forEach((k) => {
          if (S.settings && S.settings[k] !== undefined) d.settings[k] = S.settings[k];
        });
        const r = d.updatedAt || 0,
          l = S.updatedAt || 0;
        if (r > l || (login && r === l && !r)) {
          if (JSON.stringify(d) !== JSON.stringify(S))
            localStorage.setItem("carteira_bak", JSON.stringify(S));
          S = d;
          pend = false;
          localStorage.setItem(KEY, JSON.stringify(S));
          lastSync = Date.now();
          setSt("ok");
          render();
          agendaGastos();
        } else if (r < l) {
          pend = true;
          doPush();
        } else {
          lastSync = Date.now();
          setSt(pend ? "pend" : "ok");
        }
      }
      // Lê a nuvem. A primeira leitura bem-sucedida libera o envio; se a nuvem não tem nada ainda, envia este aparelho.
      async function pull() {
        if (!UID || !window.CloudSync || !navigator.onLine) return;
        const uid = UID;
        try {
          const n = await CloudSync.buscarDaNuvem(uid);
          if (uid !== UID) return;
          const primeira = !nuvemOk;
          nuvemOk = true;
          if (n) remote(n, primeira);
          else if (primeira) {
            pend = true;
            doPush();
          }
        } catch (e) {
          erroSync = e;
          console.error("sync leitura", e);
          if (uid === UID) setSt(navigator.onLine ? "err" : "off");
        }
      }
      async function clock() {
        try {
          const a = Date.now(),
            r = await fetch("https://worldtimeapi.org/api/timezone/Etc/UTC", { cache: "no-store" }),
            j = await r.json(),
            b = Date.now();
          sk = j.unixtime * 1000 + (b - a) / 2 - b;
        } catch (e) {}
      }
      window.addEventListener("cloudsync-pronto", () => {
        CloudSync.onAuthStateChanged(async (u) => {
          if (CloudSync.pararDeOuvir) CloudSync.pararDeOuvir();
          if (u) {
            UID = u.uid;
            nuvemOk = false;
            $("ctS").textContent = "Conectado como " + u.email;
            setSt("pend");
            // Se a leitura falhar, NÃO sobe os dados do aparelho: tenta de novo (ao voltar a rede, a cada minuto, ao reabrir o app).
            try {
              const n = await CloudSync.buscarDaNuvem(u.uid);
              nuvemOk = true;
              if (n) remote(n, true);
              else {
                pend = true;
                await doPush();
              }
            } catch (e) {
              erroSync = e;
              console.error("sync entrada", e);
              setSt(navigator.onLine ? "err" : "off");
            }
            render();
            atualizarGastos(true);
            CloudSync.ouvirMudancas(u.uid, (d) => {
              nuvemOk = true;
              remote(d);
            });
            fiadoNuvem(true);
            if (CloudSync.ouvirFiado)
              CloudSync.ouvirFiado(
                u.uid,
                (d) => {
                  fiadoErro = "";
                  fiadoCapt(d);
                },
                (e) => {
                  fiadoErro = e && e.code === "permission-denied" ? "sem permissão para ler o Fiado (ajustar a regra de fiado_usuarios no Firestore)" : "não consegui ouvir o Fiado";
                },
              );
            // Acompanha o app de contas ao vivo: quando ele salvar, o Dashboards atualiza sozinho.
            if (CloudSync.ouvirGastos)
              CloudSync.ouvirGastos(
                u.uid,
                () => agendaGastos(),
                (e) => {
                  gStatus = { ok: 0, em: Date.now(), erro: gErro(e) };
                },
              );
          } else {
            UID = null;
            nuvemOk = false;
            pend = false;
            $("ctS").textContent = "Dados salvos apenas neste aparelho.";
            setSt("local");
            render();
          }
        });
      });
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          if (viraAno()) save();
          pull();
          doPush();
          if (!S.settings.gAt || Date.now() - S.settings.gAt > 12e4) atualizarGastos(true);
        }
      });
      addEventListener("online", () => {
        pull();
        doPush();
      });
      addEventListener("offline", () => setSt("off"));
      addEventListener("pagehide", () => {
        if (pend) doPush();
      });
      setInterval(() => {
        if (pend) doPush();
        else pull();
      }, 60000);
      setInterval(() => {
        if (viraAno()) save();
      }, 20000);
      $("ctS").textContent = "Dados salvos apenas neste aparelho.";
      // Sempre confere a versão nova do app na rede; se houver, recarrega uma vez sozinho.
      if ("serviceWorker" in navigator) {
        const tinha = !!navigator.serviceWorker.controller;
        let rec = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (tinha && !rec) {
            rec = true;
            location.reload();
          }
        });
        addEventListener("load", () =>
          navigator.serviceWorker
            .register("sw.js", { updateViaCache: "none" })
            .then((r) => {
              r.update().catch(() => {});
              document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "visible") r.update().catch(() => {});
              });
            })
            .catch(() => {}),
        );
      }
      fiadoLer();
      addEventListener("storage", (e) => {
        if (e.key === "caderneta_pessoas_v2" || e.key === "caderneta_updatedAt_v2") {
          if (fiadoLer()) {
            fiadoAtual();
          }
        }
      });
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          if (fiadoLer()) fiadoAtual();
          fiadoNuvem();
        }
      });
      setInterval(() => {
        if (fiadoLer()) fiadoAtual();
        fiadoNuvem();
      }, 30000);
      if (viraAno()) save();
      render();
      clock();
      setTimeout(() => {
        if (!S.settings.gAt || Date.now() - S.settings.gAt > 18e5) atualizarGastos(true);
      }, 1500);
      if (!S.settings.taxas.at || Date.now() - S.settings.taxas.at > 432e5)
        taxas().then((ok) => ok && save(true));
    </script>
  </body>
</html>
