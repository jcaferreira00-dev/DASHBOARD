<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1E2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carteira">
<title>Carteira — Controle de Ativos</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
  :root{
    --bg: #0A0E1A;
    --bg-deep: #060811;
    --surface: rgba(255,255,255,.05);
    --surface-raised: rgba(255,255,255,.09);
    --rule: rgba(255,255,255,.10);
    --gold: #FFC53D;
    --gold-soft: rgba(255,197,61,.16);
    --brick: #FF5C7A;
    --violet: #8B5CF6;
    --cyan: #22D3EE;
    --coral: #FF5C7A;
    --lime: #2EE6A6;
    --cream: #F3EFE6;
    --muted: #9AA6C0;
    --radius: 14px;
    --radius-sm: 9px;
  }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }
  .aurora{ position:fixed; inset:0; z-index:-1; overflow:hidden; background:var(--bg-deep); }
  .aurora::before, .aurora::after{
    content:''; position:absolute; width:130vmax; height:130vmax; left:50%; top:50%;
    background:
      radial-gradient(circle at 20% 25%, rgba(139,92,246,.32), transparent 40%),
      radial-gradient(circle at 75% 20%, rgba(34,211,238,.26), transparent 38%),
      radial-gradient(circle at 30% 80%, rgba(46,230,166,.22), transparent 40%),
      radial-gradient(circle at 80% 75%, rgba(255,92,122,.24), transparent 38%);
    transform: translate(-50%,-50%);
    animation: auroraDrift 26s ease-in-out infinite alternate;
    filter: blur(4px);
  }
  .aurora::after{ animation-duration:34s; animation-direction:alternate-reverse; opacity:.7; }
  @keyframes auroraDrift{
    0%{ transform: translate(-52%,-54%) rotate(0deg) scale(1); }
    50%{ transform: translate(-48%,-46%) rotate(8deg) scale(1.08); }
    100%{ transform: translate(-53%,-50%) rotate(-6deg) scale(1); }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background: transparent;
    color: var(--cream);
    font-family: 'Space Grotesk', sans-serif;
    min-height:100vh;
    padding-bottom: 90px;
  }
  ::selection{ background: var(--gold-soft); }
  .mono{ font-family:'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  .display{ font-family:'Fraunces', serif; }
  .money{ transition: filter .2s ease; }
  body.blur-on .money{ filter: blur(7px); user-select:none; }

  .material-symbols-outlined{
    font-family: 'Material Symbols Outlined';
    font-weight: normal;
    font-style: normal;
    font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    font-size: 19px; line-height:1; vertical-align:middle; display:inline-block;
    letter-spacing:normal; text-transform:none; white-space:nowrap; word-wrap:normal; direction:ltr;
    -webkit-font-smoothing: antialiased;
  }
  .icn-arrow{ font-size:15px; vertical-align:-3px; }
  .icn-del{ font-size:16px; }
  .icn-sm{ font-size:16px; }

  /* ===== Header ===== */
  header.top{
    position: sticky; top:0; z-index: 20;
    background: rgba(8,10,20,.62);
    backdrop-filter: blur(18px) saturate(1.4);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    border-bottom: 1px solid var(--rule);
  }
  .head-inner{ padding: 14px 18px 12px; transition: padding .25s ease; }
  header.top.collapsed .head-inner{ padding-bottom: 8px; }

  .head-row-top{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .brand{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .brand .eyebrow{ font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color: var(--muted); transition: opacity .2s ease, max-height .2s ease; overflow:hidden; max-height:14px; }
  header.top.collapsed .brand .eyebrow{ opacity:0; max-height:0; }
  .brand h1{
    font-family:'Fraunces', serif; font-style:italic; font-weight:600; font-size:23px; margin:0; transition: font-size .25s ease;
    background: linear-gradient(100deg, var(--gold), var(--coral) 30%, var(--violet) 60%, var(--cyan) 90%);
    background-size: 300% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation: brandShimmer 8s ease-in-out infinite;
  }
  @keyframes brandShimmer{ 0%,100%{ background-position:0% 50%; } 50%{ background-position:100% 50%; } }
  header.top.collapsed .brand h1{ font-size:18px; }

  .head-actions{ display:flex; gap:7px; flex-shrink:0; }
  .icon-btn{
    width:33px; height:33px; border-radius:50%; border:1px solid var(--rule); background: var(--surface);
    color: var(--muted); font-size:14.5px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    cursor:pointer; padding:0; transition: transform .15s ease, color .15s ease, border-color .15s ease;
  }
  .icon-btn:hover{ transform: translateY(-1px) scale(1.06); color: var(--cream); }
  .icon-btn.active{ color: var(--gold); border-color: var(--gold); background: var(--gold-soft); }
  .icon-btn.synced{ color:#2EE6A6; border-color: rgba(46,230,166,.4); }

  .head-expanded{
    overflow:hidden; max-height:150px; opacity:1; margin-top:14px;
    transition: max-height .28s ease, opacity .2s ease, margin-top .28s ease;
  }
  header.top.collapsed .head-expanded{ max-height:0; opacity:0; margin-top:0; }

  .total-row{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  #totalResultPill{ margin-right:6px; }
  @media (min-width:720px){
    #totalResultPill{ margin-right:0; }
  }
  .wealth-chart-wrap{ display:none; }
  @media (min-width:720px){
    .head-expanded{ max-height:190px; }
    .total-row{ align-items:center; }
    .wealth-chart-wrap{
      display:flex; flex-direction:column; justify-content:center; gap:2px; flex:1; min-width:220px; max-width:340px; height:64px;
    }
    .wealth-chart-wrap .lbl{ font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
    .wealth-chart-wrap svg{ width:100%; height:52px; display:block; }
  }
  .total-value{ font-size:36px; font-weight:600; letter-spacing:-.01em; }
  .total-value small{ font-size:17px; color: var(--muted); font-weight:500; }
  .total-sub{ display:flex; gap:18px; margin-top:4px; flex-wrap:wrap;}
  .total-sub .stat{ font-size:11.5px; color: var(--muted); }
  .total-sub .stat b{ display:block; font-size:13.5px; color: var(--cream); margin-top:1px; font-weight:600; }

  .result-pill{
    font-size:13px; font-weight:600; padding:5px 10px; border-radius:999px;
    display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
    animation: pillPulse 2.6s ease-in-out infinite;
    align-self:center; flex:0 0 auto; height:26px; box-sizing:border-box;
  }
  .result-pill.pos{ color:#2EE6A6; background: rgba(46,230,166,.12); box-shadow:0 0 0 0 rgba(46,230,166,.3); }
  .result-pill.neg{ color:#FF5C7A; background: rgba(255,92,122,.12); box-shadow:0 0 0 0 rgba(255,92,122,.3); }
  .result-pill.sm{ font-size:10.5px; padding:3px 8px; animation:none; height:20px; }
  @keyframes pillPulse{
    0%,100%{ box-shadow:0 0 0 0 currentColor; }
    50%{ box-shadow:0 0 10px 1px currentColor; }
  }

  .head-collapsed{
    display:none; align-items:center; gap:10px; overflow:hidden; max-height:0; opacity:0;
    transition: max-height .28s ease, opacity .2s ease, margin-top .28s ease; margin-top:0;
  }
  header.top.collapsed .head-collapsed{ display:flex; max-height:50px; opacity:1; margin-top:10px; }
  .collapsed-nums{ display:flex; align-items:center; gap:9px; }
  .collapsed-nums .cv{ font-size:16px; font-weight:600; }

  /* ===== Ticker marquee ===== */
  .ticker-marquee{
    overflow:hidden; border-bottom:1px solid var(--rule); background: rgba(255,255,255,.03);
    white-space:nowrap; position:relative;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
  }
  .ticker-marquee.empty{ display:none; }
  .ticker-track{ display:inline-flex; align-items:center; width:max-content; animation: tickerScroll 32s linear infinite; }
  .ticker-track:hover{ animation-play-state: paused; }
  @keyframes tickerScroll{ from{ transform: translateX(0); } to{ transform: translateX(-50%); } }
  .ticker-item{ display:inline-flex; align-items:center; gap:6px; padding:7px 16px; font-size:12px; border-right:1px solid var(--rule); flex-shrink:0; }
  .ticker-item .tk-dot{ width:6px; height:6px; border-radius:50%; box-shadow:0 0 7px 1.5px var(--tc); flex-shrink:0; }
  .ticker-item .tk{ font-weight:700; color:var(--cream); font-family:'IBM Plex Mono', monospace; }
  .ticker-item .pct{ font-family:'IBM Plex Mono', monospace; font-weight:600; }
  .ticker-item .res{ font-family:'IBM Plex Mono', monospace; color:var(--muted); }
  .ticker-item .pct.pos, .ticker-item .res.pos{ color:var(--lime); }
  .ticker-item .pct.neg, .ticker-item .res.neg{ color:var(--coral); }

  /* ===== Tabs ===== */
  nav.tabs{
    display:flex; gap:3px; padding: 4px; margin: 14px 18px 0;
    background: var(--surface); border:1px solid var(--rule); border-radius: 999px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    position:relative; overflow-x:auto; scrollbar-width:none;
  }
  header.top.collapsed nav.tabs{ margin-top:10px; }
  nav.tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{
    --tc: var(--gold);
    flex:1; min-width:max-content; background:none; border:none; color: var(--muted);
    font-family:'Space Grotesk'; font-size:13px; font-weight:600; padding:9px 14px; border-radius:999px;
    display:flex; align-items:center; gap:7px; cursor:pointer; white-space:nowrap;
    transition: background .3s cubic-bezier(.34,1.56,.64,1), color .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease;
  }
  .tab-btn:hover{ color: var(--cream); transform: translateY(-1px); }
  .tab-btn .dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; box-shadow: 0 0 6px 1px var(--tc); transition: box-shadow .25s ease; }
  .tab-btn.active{
    color: #0A0E1A;
    background: linear-gradient(135deg, var(--tc), color-mix(in srgb, var(--tc) 55%, white));
    box-shadow: 0 3px 14px -2px var(--tc), 0 0 0 1px color-mix(in srgb, var(--tc) 50%, transparent);
    transform: scale(1.04);
    animation: tabPop .35s cubic-bezier(.34,1.56,.64,1);
  }
  .tab-btn.active .dot{ background:#0A0E1A !important; box-shadow:none; }
  @keyframes tabPop{ 0%{ transform:scale(.94); } 60%{ transform:scale(1.07); } 100%{ transform:scale(1.04); } }
  .tab-btn.add{ flex:0 0 auto; width:34px; padding:9px; justify-content:center; color: var(--gold); font-weight:700; font-size:16px; }
  .tab-btn.add:hover{ background: var(--gold-soft); }

  main{ padding: 16px 18px 0; max-width: 720px; margin:0 auto; }
  .panel{ display:none; animation: fadeIn .25s ease; }
  .panel.active{ display:block; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .summary-cards{ display:grid; grid-template-columns: repeat(3,1fr); gap:8px; margin-bottom:16px; }
  .card{
    position:relative; background: var(--surface); border:1px solid var(--rule); border-radius: var(--radius-sm);
    padding:12px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    overflow:hidden; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background: linear-gradient(90deg, var(--cat-color, var(--gold)), color-mix(in srgb, var(--cat-color, var(--gold)) 40%, transparent));
  }
  .card:hover{ transform: translateY(-2px); border-color: color-mix(in srgb, var(--cat-color, var(--gold)) 45%, var(--rule)); }
  .panel{ --cat-color: var(--gold); }
  .card .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color: var(--muted); }
  .card .value{ font-size:16px; font-weight:600; margin-top:5px; }
  .card .value.pos{ color:#2EE6A6; } .card .value.neg{ color:#FF5C7A; }

  .section-head{ display:flex; justify-content:space-between; align-items:center; margin: 18px 0 8px; }
  .section-head h2{ font-family:'Fraunces', serif; font-weight:500; font-size:16px; margin:0; color: var(--cream); }
  .section-head .hint{ font-size:11px; color: var(--muted); }

  .ledger{ border:1px solid var(--rule); border-radius: var(--radius); overflow:hidden; background: var(--surface); }
  .pos-row{ border-bottom:1px solid var(--rule); }
  .pos-row:last-child{ border-bottom:none; }
  .pos-head{ display:flex; align-items:center; justify-content:space-between; padding:13px 14px; cursor:pointer; gap:10px; }
  .pos-id{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .pos-id .tk{ font-weight:600; font-size:14.5px; }
  .pos-id .sub{ font-size:11.5px; color: var(--muted); }
  .pos-nums{ text-align:right; flex-shrink:0; }
  .pos-nums .val{ font-size:14.5px; font-weight:600; }
  .pos-nums .chg{ font-size:11.5px; margin-top:2px; }
  .pos-detail{ display:none; padding:0 14px 14px; border-top:1px dashed var(--rule); }
  .pos-detail.open{ display:block; }
  .pos-detail .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0; }
  .mini-stat{ font-size:11px; color:var(--muted); }
  .mini-stat b{ display:block; font-size:13px; color:var(--cream); font-family:'IBM Plex Mono',monospace; }

  .price-edit{ display:flex; align-items:center; gap:8px; margin: 10px 0; }
  .price-edit input{ width:110px; }
  .price-edit label{ font-size:11.5px; color:var(--muted); }

  .history{ margin-top:10px; }
  .history-item{ display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--rule); font-size:12.5px; }
  .history-item:last-child{ border-bottom:none; }
  .history-item .tag{ font-size:10px; padding:2px 6px; border-radius:5px; font-weight:600; margin-right:6px; }
  .tag.compra, .tag.entrada{ background: rgba(46,230,166,.14); color:#2EE6A6; }
  .tag.venda, .tag.saida{ background: rgba(255,92,122,.14); color:#FF5C7A; }
  .history-item .del{ color:var(--muted); cursor:pointer; font-size:14px; padding:0 4px; }

  .row-actions{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .btn-sm{ flex:1; min-width:90px; }

  .empty{ text-align:center; padding: 40px 20px; color: var(--muted); }
  .empty .display{ font-size:17px; color: var(--cream); margin-bottom:6px; }
  .empty p{ font-size:13px; margin: 0 0 16px; line-height:1.5; }

  button{ font-family:'Space Grotesk'; cursor:pointer; }
  .btn{
    background: linear-gradient(135deg, var(--gold), var(--coral));
    color:#1A140A; border:none; border-radius: 999px; padding:10px 18px; font-weight:700; font-size:13px; letter-spacing:.01em;
    box-shadow: 0 4px 16px -4px rgba(255,197,61,.5);
    transition: transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease, filter .2s ease;
  }
  .btn:hover{ filter:brightness(1.08); box-shadow: 0 6px 20px -4px rgba(255,197,61,.65); }
  .btn.ghost{ background: transparent; color: var(--cream); border:1px solid var(--rule); font-weight:600; box-shadow:none; }
  .btn.ghost:hover{ border-color: var(--cyan); color: var(--cyan); }
  .btn.danger{ background: transparent; color:#FF5C7A; border:1px solid rgba(255,92,122,.4); font-weight:600; box-shadow:none; }
  .btn:active{ transform: scale(.96); }

  .fab{
    position: fixed; right:18px; bottom:22px; z-index:30;
    width:46px; height:46px; border-radius:50%; background: linear-gradient(135deg, var(--violet), var(--cyan)); color:#0A0E1A;
    border:none; box-shadow: 0 6px 20px -3px rgba(139,92,246,.55), 0 2px 6px rgba(0,0,0,.25);
    display:flex; align-items:center; justify-content:center;
    transition: transform .15s ease, box-shadow .15s ease;
    animation: fabBreathe 3.4s ease-in-out infinite;
  }
  @keyframes fabBreathe{ 0%,100%{ box-shadow:0 6px 20px -3px rgba(139,92,246,.55), 0 2px 6px rgba(0,0,0,.25); } 50%{ box-shadow:0 6px 26px -1px rgba(34,211,238,.65), 0 2px 6px rgba(0,0,0,.25); } }
  .fab:active{ transform: scale(.92); }
  .fab .material-symbols-outlined{ font-size:22px; font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 24; }

  input, select{
    width:100%; background: var(--bg); border:1px solid var(--rule); color: var(--cream);
    border-radius: 8px; padding: 10px 11px; font-size:14px; font-family:'IBM Plex Mono', monospace;
  }
  input[type=text], select{ font-family:'Space Grotesk'; }
  input:focus, select:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  label.field{ display:block; font-size:11.5px; color: var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.06em; }
  .field-group{ margin-bottom:12px; }
  .desc{ font-size:12px; color:var(--muted); line-height:1.5; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .overlay{ position:fixed; inset:0; background: rgba(4,6,12,.66); backdrop-filter: blur(2px); z-index:50; display:none; align-items:flex-end; justify-content:center; }
  .overlay.open{ display:flex; }
  .modal{
    background: rgba(14,17,30,.88); backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3);
    border:1px solid var(--rule); border-radius: 18px 18px 0 0;
    width:100%; max-width:480px; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height: 88vh; overflow-y:auto; animation: slideUp .25s cubic-bezier(.2,.9,.3,1);
  }
  .modal.large{ max-height:92vh; max-width:520px; }
  @keyframes slideUp{ from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .modal-head h3{ font-family:'Fraunces', serif; font-weight:500; font-size:19px; margin:0; }
  .modal-head .close{ background:none; border:none; color:var(--muted); font-size:22px; line-height:1; }
  .seg{ display:flex; gap:6px; margin-bottom:14px; background: var(--bg); padding:4px; border-radius:10px; }
  .seg button{ flex:1; background:none; border:none; color:var(--muted); font-weight:600; font-size:12px; padding:8px 6px; border-radius:7px; }
  .seg button.active{ background: var(--surface); color: var(--cream); }

  /* Dashboard modal */
  .dash-donut-wrap{ display:flex; flex-direction:column; align-items:center; gap:16px; margin: 6px 0 20px; }
  .dash-legend{ width:100%; display:flex; flex-direction:column; gap:8px; }
  .dash-legend-row{ display:flex; align-items:center; justify-content:space-between; font-size:13px; padding:2px 0; }
  .dash-legend-row .left{ display:flex; align-items:center; gap:8px; color:var(--cream); }
  .dash-legend-row .sw{ width:9px;height:9px;border-radius:3px; flex-shrink:0; }
  .dash-legend-row .right{ color:var(--muted); font-size:12px; }

  .bar-block{ margin-bottom:16px; }
  .bar-label{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:6px; }
  .bar-label .name{ display:flex; align-items:center; gap:7px; color:var(--cream); font-weight:600;}
  .bar-label .sw{ width:8px;height:8px;border-radius:2px; flex-shrink:0; }
  .bar-track{ height:9px; background:var(--bg); border-radius:5px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:5px; transition: width .4s ease; }
  .bar-legend-inline{ font-size:11px; color:var(--muted); display:flex; justify-content:space-between; margin-top:4px; }

  /* Tools */
  .tools-section{ margin-bottom:22px; }
  .tools-section h4{ font-family:'Fraunces'; font-weight:500; font-size:14.5px; margin:0 0 9px; color:var(--cream); }
  .tools-section p.desc{ font-size:12px; color:var(--muted); margin:0 0 10px; line-height:1.5; }
  .tools-row{ display:flex; gap:8px; align-items:center; }
  .tools-row input{ flex:1; }

  .swatch:hover{ transform: scale(1.15); }

  @media (max-width:380px){

  /* Em telas grandes, o modal "large" (usado pelo Dashboard) vira um
     diálogo centralizado, bem maior, com painel extra de detalhes */

  .dash-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .dash-table th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:600; padding:0 10px 8px; border-bottom:1px solid var(--rule); }
  .dash-table td{ padding:9px 10px; border-bottom:1px solid var(--rule); color:var(--cream); vertical-align:middle; }
  .dash-table tbody tr:last-child td{ border-bottom:none; }
  .dash-table td .sw{ display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:7px; }
  .dash-table-sub{ display:block; font-size:11px; color:var(--muted); margin-top:1px; }
  .dash-table td.money, .dash-table th:nth-child(n+3){ text-align:right; }
</style>

<script type="module" src="cloud-sync.js"></script>
<script>
/* =========================================================
   ESTADO / MODELO DE DADOS
   categories: lista de guias (fixas + criadas pelo usuário)
   data[catId]: 'market' -> {positions,history} | 'saldo' -> {items,moves}
========================================================= */
function defaultState(){
  return {
    categories: [
      { id:'acoes',       label:'Ações',       color:'#3B9EFF', type:'market', unit:'ação',   builtIn:true },
      { id:'fiis',        label:'FIIs',        color:'#12D18E', type:'market', unit:'FII',    builtIn:true },
      { id:'previdencia', label:'Previdência', color:'#E0B84C', type:'saldo',  unit:'plano',  builtIn:true, entradaLabel:'Aporte', saidaLabel:null },
      { id:'crypto',      label:'Crypto',      color:'#B14EFF', type:'market', unit:'ativo',  builtIn:true },
      { id:'fgts',        label:'FGTS',        color:'#1EC9C9', type:'saldo',  unit:'conta',  builtIn:true, entradaLabel:'Depósito', saidaLabel:'Saque' },
    ],
    data: {
      acoes:       { positions: [], history: [] },
      fiis:        { positions: [], history: [] },
      previdencia: { items: [], moves: [] },
      crypto:      { positions: [], history: [] },
      fgts:        { items: [], moves: [] },
    },
    settings: {
      brapiTokens: []
    },
    wealthHistory: []
  };
}

function isOldFormat(s){ return s && !s.categories && (s.acoes || s.fiis || s.previdencia || s.crypto || s.fgts); }
function migrateOldState(old){
  const fresh = defaultState();
  if (old.acoes)  fresh.data.acoes  = { positions: old.acoes.positions||[], history: old.acoes.history||[] };
  if (old.fiis)   fresh.data.fiis   = { positions: old.fiis.positions||[], history: old.fiis.history||[] };
  if (old.crypto) fresh.data.crypto = { positions: old.crypto.positions||[], history: old.crypto.history||[] };
  if (old.previdencia) fresh.data.previdencia = {
    items: (old.previdencia.plans||[]).map(p=>({id:p.id, nome:p.nome, subtitulo:p.instituicao||'', saldoAtual:p.saldoAtual||0})),
    moves: (old.previdencia.aportes||[]).map(a=>({id:a.id, itemId:a.planId, tipo:'entrada', valor:a.valor, data:a.data}))
  };
  if (old.fgts) fresh.data.fgts = {
    items: (old.fgts.contas||[]).map(c=>({id:c.id, nome:c.empregador, subtitulo:'', saldoAtual:c.saldoAtual||0})),
    moves: (old.fgts.movimentos||[]).map(m=>({id:m.id, itemId:m.contaId, tipo: m.tipo==='deposito'?'entrada':'saida', valor:m.valor, data:m.data}))
  };
  return fresh;
}
function normalizeState(s){
  if (!s) return defaultState();
  if (isOldFormat(s)) s = migrateOldState(s);
  if (!s.categories || !s.data) return defaultState();
  if (!s.settings) s.settings = { brapiTokens: [] };
  if (!s.settings.brapiTokens) s.settings.brapiTokens = [];
  if (!s.wealthHistory) s.wealthHistory = [];
  return s;
}
function recordWealthSnapshot(g){
  const hist = STATE.wealthHistory;
  const today = todayISO();
  const last = hist[hist.length-1];
  if (last && last.data === today) last.valor = g.atual;
  else hist.push({ data: today, valor: g.atual });
  if (hist.length > 180) hist.splice(0, hist.length - 180);
}

const STORAGE_KEY = 'carteira_v1';
let CURRENT_UID = null;
let CURRENT_USER_EMAIL = null;
let SUPPRESS_NEXT_SNAPSHOT = false;

const DB = {
  async load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? normalizeState(JSON.parse(raw)) : defaultState();
    }catch(e){ return defaultState(); }
  },
  async save(state){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if (CURRENT_UID && window.CloudSync){
      try{
        SUPPRESS_NEXT_SNAPSHOT = true;
        await window.CloudSync.salvarNaNuvem(CURRENT_UID, state);
      }catch(e){ console.warn('Falha ao sincronizar:', e); setSyncBadge('erro'); }
    }
  }
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

let STATE = null;
let ACTIVE_TAB = 'acoes';
const OPEN_ROWS = new Set();

/* =========================================================
   FORMAT HELPERS
========================================================= */
const fmtBRL = (n) => (n<0?'-':'') + 'R$ ' + Math.abs(n).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
const fmtBRLShort = (n) => (n<0?'-':'') + 'R$ ' + Math.abs(n).toLocaleString('pt-BR',{minimumFractionDigits:0, maximumFractionDigits:0});
const fmtPct = (n) => (n>0?'+':'') + n.toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}) + '%';
const fmtDate = (iso) => { const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`; };
const fmtDateTime = (iso) => { try{ return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return '—'; } };
const fmtNum = (n, dec=0) => n.toLocaleString('pt-BR',{minimumFractionDigits:dec, maximumFractionDigits:dec});
function arrowIcon(positive, size=15){
  return `<span class="material-symbols-outlined icn-arrow" style="font-size:${size}px">${positive?'arrow_upward':'arrow_downward'}</span>`;
}

/* =========================================================
   DERIVED CALCS
========================================================= */
function calcPositionMetrics(pos){
  const investido = pos.qtd * pos.precoMedio;
  const atual = pos.qtd * pos.precoAtual;
  const resultado = atual - investido;
  const pct = investido > 0 ? (resultado/investido*100) : 0;
  return { investido, atual, resultado, pct };
}

function marketTotals(catId){
  const d = STATE.data[catId];
  let investido=0, atual=0;
  (d.positions||[]).forEach(p=>{ const m = calcPositionMetrics(p); investido+=m.investido; atual+=m.atual; });
  return { investido, atual, resultado: atual-investido, pct: investido>0?((atual-investido)/investido*100):0 };
}
function saldoTotals(catId){
  const d = STATE.data[catId];
  let saldo=0, movimentado=0;
  (d.items||[]).forEach(i=>{ saldo += i.saldoAtual||0; });
  (d.moves||[]).forEach(m=>{ movimentado += (m.tipo==='entrada'? m.valor : -m.valor); });
  return { investido: movimentado, atual: saldo, resultado: saldo-movimentado, pct: movimentado>0?((saldo-movimentado)/movimentado*100):0 };
}
// Regra de integralização da parte "Empresa" em planos de previdência do tipo
// Empresa/Funcionário: 08/2026=50%, 08/2027=60%, 08/2028=70%, 08/2029=80%,
// 08/2030=90%, a partir de 08/2031=100%. Antes de 08/2026, 0%. Regra interna,
// não exibida na guia.
function vestingPercentPrevidencia(refDate){
  const d = refDate ? new Date(refDate) : new Date();
  const y = d.getFullYear(), m = d.getMonth()+1;
  const marks = [
    {y:2026, m:8, pct:0.50},
    {y:2027, m:8, pct:0.60},
    {y:2028, m:8, pct:0.70},
    {y:2029, m:8, pct:0.80},
    {y:2030, m:8, pct:0.90},
    {y:2031, m:8, pct:1.00},
  ];
  let pct = 0;
  marks.forEach(mk=>{ if (y>mk.y || (y===mk.y && m>=mk.m)) pct = mk.pct; });
  return pct;
}
function refreshPrevidenciaVesting(){
  const d = STATE.data.previdencia;
  if (!d) return;
  (d.items||[]).forEach(item=>{
    if (item.modoEmpresaFuncionario){
      const pct = vestingPercentPrevidencia();
      item.saldoAtual = (item.funcionarioSaldo||0) + (item.empresaSaldo||0)*pct;
    }
  });
}

function catTotals(catId){
  const cat = STATE.categories.find(c=>c.id===catId);
  if (!cat) return {investido:0,atual:0,resultado:0,pct:0};
  return cat.type==='market' ? marketTotals(catId) : saldoTotals(catId);
}
function grandTotal(){
  let investido=0, atual=0;
  STATE.categories.forEach(c=>{ const t = catTotals(c.id); investido+=t.investido; atual+=t.atual; });
  return { investido, atual, resultado: atual-investido, pct: investido>0?((atual-investido)/investido*100):0 };
}

// Ring interno: quanto do valor atual ainda é "principal" vs "resultado"
function innerRingSegments(t){
  if (t.atual<=0 && t.investido<=0) return [{frac:1, color:'#203247'}];
  if (t.resultado>=0){
    const base = t.atual || 1;
    const principal = Math.min(1, t.investido/base);
    return [{frac:principal, color:'#8FA3B8'},{frac:Math.max(0,1-principal), color:'#C6A15B'}];
  }
  const base = t.investido || 1;
  const restante = Math.max(0, Math.min(1, t.atual/base));
  return [{frac:restante, color:'#8FA3B8'},{frac:Math.max(0,1-restante), color:'#C1503F'}];
}

/* =========================================================
   DONUT DUPLO (SVG)
========================================================= */
function ringMarkup(cx,cy,r,sw,segments){
  const circumf = 2*Math.PI*r;
  let offset=0;
  let out = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#203247" stroke-width="${sw}"></circle>`;
  segments.forEach(seg=>{
    if (seg.frac<=0) return;
    const dash = seg.frac*circumf;
    out += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${sw}"
      stroke-dasharray="${dash} ${circumf-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += dash;
  });
  return out;
}
function renderDoubleDonut(svgId, outerSegs, innerSegs, rOuter=16, swOuter=4.2, rInner=9.3, swInner=4.2){
  const svg = document.getElementById(svgId);
  if (!svg) return;
  svg.innerHTML = ringMarkup(21,21,rOuter,swOuter,outerSegs) + ringMarkup(21,21,rInner,swInner,innerSegs);
}
function allocationSegments(g){
  return STATE.categories.map(c=>{
    const t = catTotals(c.id);
    return { frac: g.atual>0 ? t.atual/g.atual : 0, color: c.color };
  }).filter(s=>s.frac>0.0008);
}

/* =========================================================
   RENDER: HEADER
========================================================= */
// Gera um histórico diário fictício (só pra visualizar o gráfico antes de
// termos 2+ dias reais de uso). Fica em cache na sessão, não é salvo no
// STATE nem sobrescreve o histórico real.
let DEMO_HISTORY_CACHE = null;
function getDemoWealthHistory(currentValue){
  if (DEMO_HISTORY_CACHE && Math.abs(DEMO_HISTORY_CACHE.base - currentValue) < 0.005){
    return DEMO_HISTORY_CACHE.data;
  }
  const days = 14;
  let seed = Math.round(currentValue * 100) || 1;
  const rnd = () => { seed = (seed*9301+49297) % 233280; return seed/233280; };
  const vals = [currentValue];
  for (let i=1; i<days; i++){
    const variation = (rnd()*0.024 - 0.012); // ±1.2% ao "dia", andando pra trás
    vals.unshift(vals[0] / (1+variation));
  }
  const today = new Date();
  const data = vals.map((v,i)=>{
    const d = new Date(today); d.setDate(d.getDate() - (days-1-i));
    return { data: d.toISOString().slice(0,10), valor: v };
  });
  DEMO_HISTORY_CACHE = { base: currentValue, data };
  return data;
}

function renderWealthChart(currentValue){
  const svg = document.getElementById('wealthChart');
  const lbl = document.getElementById('wealthChartLbl');
  if (!svg) return;
  let hist = (STATE.wealthHistory||[]).filter(h=>h.valor>0);
  let isDemo = false;
  if (hist.length < 2 && currentValue > 0){
    hist = getDemoWealthHistory(currentValue);
    isDemo = true;
  }
  if (lbl) lbl.innerHTML = 'Evolução do patrimônio' + (isDemo ? ' <span style="opacity:.6; text-transform:none; letter-spacing:0;">(exemplo — some quando houver histórico real)</span>' : '');
  if (hist.length < 2){ svg.innerHTML = ''; return; }
  const W=300, H=52, pad=3;
  const vals = hist.map(h=>h.valor);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max-min) || 1;
  const stepX = (W-pad*2) / (hist.length-1);
  const pts = hist.map((h,i)=>{
    const x = pad + i*stepX;
    const y = H - pad - ((h.valor-min)/range)*(H-pad*2);
    return [x,y];
  });
  const up = vals[vals.length-1] >= vals[0];
  const color = up ? '#2EE6A6' : '#FF5C7A';
  const line = pts.map(p=>p.join(',')).join(' ');
  const areaPts = `${pad},${H-pad} ${line} ${W-pad},${H-pad}`;
  svg.innerHTML = `
    <polygon points="${areaPts}" fill="${color}" opacity="0.12"></polygon>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" ${isDemo?'stroke-dasharray="4 3"':''}></polyline>
    <circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="2.4" fill="${color}"></circle>
  `;
}

let LAST_TOTAL_ATUAL = null;
function animateTotalValue(el, from, to, duration=700){
  const start = performance.now();
  const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (prefersReduced || from==null){
    const [reais, centavos] = fmtBRL(to).replace('R$ ','').split(',');
    el.innerHTML = `R$ ${reais}<small>,${centavos||'00'}</small>`;
    return;
  }
  function frame(now){
    const t = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-t, 3);
    const val = from + (to-from)*eased;
    const [reais, centavos] = fmtBRL(val).replace('R$ ','').split(',');
    el.innerHTML = `R$ ${reais}<small>,${centavos||'00'}</small>`;
    if (t<1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function renderHeader(){
  const g = grandTotal();
  recordWealthSnapshot(g);
  const totalEl = document.getElementById('totalValue');
  animateTotalValue(totalEl, LAST_TOTAL_ATUAL===g.atual ? null : LAST_TOTAL_ATUAL, g.atual);
  LAST_TOTAL_ATUAL = g.atual;
  document.getElementById('totalInvested').textContent = fmtBRLShort(g.investido);
  document.getElementById('totalResultAbs').textContent = (g.resultado>=0?'+':'-') + fmtBRLShort(Math.abs(g.resultado));

  const pill = document.getElementById('totalResultPill');
  pill.className = 'result-pill ' + (g.resultado>=0?'pos':'neg');
  pill.innerHTML = arrowIcon(g.resultado>=0) + ' ' + fmtPct(Math.abs(g.pct)).replace('+','');

  document.getElementById('totalValueMini').textContent = fmtBRLShort(g.atual);
  const pillMini = document.getElementById('totalResultPillMini');
  pillMini.className = 'result-pill sm ' + (g.resultado>=0?'pos':'neg');
  pillMini.innerHTML = arrowIcon(g.resultado>=0, 12) + ' ' + fmtPct(Math.abs(g.pct)).replace('+','');

  renderDoubleDonut('donutMini', allocationSegments(g), innerRingSegments(g), 15, 3.4, 8.4, 3.2);
  renderWealthChart(g.atual);
}

function renderTickerMarquee(){
  const wrap = document.getElementById('tickerMarquee');
  const track = document.getElementById('tickerTrack');
  if (!wrap || !track) return;
  const rows = buildHoldingsRows();
  if (!rows.length){ wrap.classList.add('empty'); track.innerHTML=''; return; }
  wrap.classList.remove('empty');
  const itemHtml = rows.map(r=>{
    const pos = r.resultado>=0;
    return `<span class="ticker-item" style="--tc:${r.catColor}"><span class="tk-dot" style="background:${r.catColor}"></span><span class="tk">${escapeHtmlLite(r.nome)}</span><span class="pct ${pos?'pos':'neg'}">${fmtPct(r.pct)}</span><span class="res ${pos?'pos':'neg'} money">${(pos?'+':'')+fmtBRLShort(r.resultado)}</span></span>`;
  }).join('');
  // duplicated for a seamless infinite loop
  track.innerHTML = itemHtml + itemHtml;
}

function handleScroll(){
  const y = window.scrollY || document.documentElement.scrollTop;
  const header = document.getElementById('topHeader');
  if (y>60) header.classList.add('collapsed');
  else if (y<24) header.classList.remove('collapsed');
}

/* =========================================================
   RENDER: HELPERS DE PAINEL
========================================================= */
function summaryCardsHtml(t, labels){
  const L = labels || { investLabel:'Aportado', currentLabel:'Valor atual', resultLabel:'Resultado' };
  return `
    <div class="summary-cards">
      <div class="card"><div class="label">${L.investLabel}</div><div class="value mono money">${fmtBRLShort(t.investido)}</div></div>
      <div class="card"><div class="label">${L.currentLabel}</div><div class="value mono money">${fmtBRLShort(t.atual)}</div></div>
      <div class="card"><div class="label">${L.resultLabel}</div><div class="value mono money ${t.resultado>=0?'pos':'neg'}">${(t.resultado>=0?'+':'')+fmtBRLShort(t.resultado)} · ${fmtPct(t.pct)}</div></div>
    </div>`;
}
function sectionHeadHtml(title, count, noun){

function fgtsRescisaoHtml(catId){
  const d = STATE.data[catId];
  const items = d.items || [];
  const saldoAtualTotal = items.reduce((s,i)=> s + (i.saldoAtual||0), 0);
  // fallback pra contas antigas que ainda não têm o campo totalDepositado preenchido:
  // usa a soma das entradas registradas como aproximação.
  const movesEntradas = (d.moves||[]).filter(m=>m.tipo==='entrada').reduce((s,m)=> s + m.valor, 0);
  const totalDepositado = items.reduce((s,i)=> s + (i.totalDepositado!=null ? i.totalDepositado : 0), 0) || movesEntradas;
  const multa40 = totalDepositado * 0.4;
  const totalRescisorio = saldoAtualTotal + multa40;
  return `
    <div class="card" style="margin-bottom:16px;">
      <div class="label">Simulação para fins rescisórios</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0 0;">
        <div class="mini-stat">Total depositado (histórico)<b class="money">${fmtBRL(totalDepositado)}</b></div>
        <div class="mini-stat">Multa 40% (sobre o histórico)<b class="money">${fmtBRL(multa40)}</b></div>
      </div>
      <div class="mini-stat" style="margin-top:10px;">Saldo atual na conta<b class="money">${fmtBRL(saldoAtualTotal)}</b></div>
      <div class="mini-stat" style="margin-top:10px; padding-top:10px; border-top:1px dashed var(--rule);">Total para fins rescisórios (saldo atual + multa)<b class="money" style="font-size:15px;">${fmtBRL(totalRescisorio)}</b></div>
      <p class="desc" style="margin:10px 0 0;">Multa de 40% calculada sobre o total histórico depositado — que pode ser maior que o saldo atual se já houve saque. O cálculo geral da carteira considera apenas o saldo atual na conta.</p>
    </div>`;
}

function ensurePanelElements(){
  const main = document.getElementById('mainContent');
  const existingIds = new Set(STATE.categories.map(c=>'panel-'+c.id));
  // remove órfãos
  Array.from(main.querySelectorAll('.panel')).forEach(p=>{ if(!existingIds.has(p.id)) p.remove(); });
  // cria faltantes
  STATE.categories.forEach(c=>{
    if (!document.getElementById('panel-'+c.id)){
      const sec = document.createElement('section');
      sec.className = 'panel';
      sec.id = 'panel-'+c.id;
      main.appendChild(sec);
    }
    document.getElementById('panel-'+c.id).style.setProperty('--cat-color', c.color);
  });
}

function renderTabs(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = STATE.categories.map(c=>`
    <button class="tab-btn ${ACTIVE_TAB===c.id?'active':''}" data-tab="${c.id}" style="--tc:${c.color}"><span class="dot" style="background:${c.color}"></span>${c.label}</button>
  `).join('') + `<button class="tab-btn add" data-tab="__add__" title="Nova guia"><span class="material-symbols-outlined icn-sm">add</span></button>`;
  document.querySelectorAll('.panel').forEach(p=> p.classList.toggle('active', p.id === 'panel-'+ACTIVE_TAB));
}

function renderAll(){
  ensurePanelElements();
  refreshPrevidenciaVesting();
  renderHeader();
  renderTickerMarquee();
  renderTabs();
  STATE.categories.forEach(cat=>{
    if (cat.type === 'market') renderMarketPanel(cat); else renderSaldoPanel(cat);
  });
}

function toggleRow(id){
  if (OPEN_ROWS.has(id)) OPEN_ROWS.delete(id); else OPEN_ROWS.add(id);
  renderAll();
}

async function persist(){ await DB.save(STATE); renderAll(); }

function updatePrice(catId, posId){
  const input = document.getElementById('price-'+posId);
  const val = parseFloat(input.value);
  if (isNaN(val) || val < 0) return;
  STATE.data[catId].positions.find(p=>p.id===posId).precoAtual = val;
  persist();
}
function updateEmpresaFuncionario(catId, itemId){
  const empresaInput = document.getElementById('empresa-'+itemId);
  const funcInput = document.getElementById('funcionario-'+itemId);
  const empresaSaldo = parseFloat(empresaInput.value); const funcionarioSaldo = parseFloat(funcInput.value);

  const item = STATE.data[catId].items.find(i=>i.id===itemId);
  item.empresaSaldo = empresaSaldo; item.funcionarioSaldo = funcionarioSaldo;
  refreshPrevidenciaVesting();
  persist();
}
function updateSaldo(catId, itemId){
  const input = document.getElementById('saldo-'+itemId);
  const val = parseFloat(input.value);
  if (isNaN(val) || val < 0) return;
  STATE.data[catId].items.find(i=>i.id===itemId).saldoAtual = val;
  persist();
}
function updateFgtsTotalDepositado(catId, itemId){
  const input = document.getElementById('totaldep-'+itemId);

function deletePosition(catId, posId){
  if (!confirm('Excluir esta posição e todo o histórico associado?')) return;
  STATE.data[catId].positions = STATE.data[catId].positions.filter(p=>p.id!==posId);
  STATE.data[catId].history = STATE.data[catId].history.filter(h=>h.positionId!==posId);
  persist();
}
function deleteItem(catId, itemId){
  const cat = STATE.categories.find(c=>c.id===catId);
  if (!confirm(`Excluir este ${cat.unit} e todo o histórico associado?`)) return;
  STATE.data[catId].items = STATE.data[catId].items.filter(i=>i.id!==itemId);
  STATE.data[catId].moves = STATE.data[catId].moves.filter(m=>m.itemId!==itemId);
  persist();
}
function deleteTx(catId, txId){
  const cat = STATE.categories.find(c=>c.id===catId);
  if (cat.type === 'market'){
    const h = STATE.data[catId].history.find(x=>x.id===txId);
    STATE.data[catId].history = STATE.data[catId].history.filter(x=>x.id!==txId);
    if (h) recalcPositionFromHistory(catId, h.positionId);
  } else {
    const m = STATE.data[catId].moves.find(x=>x.id===txId);
    STATE.data[catId].moves = STATE.data[catId].moves.filter(x=>x.id!==txId);
    if (m){
      const item = STATE.data[catId].items.find(i=>i.id===m.itemId);
      if (item) item.saldoAtual -= (m.tipo==='entrada'? m.valor : -m.valor);
    }
  }
  persist();
}
function recalcPositionFromHistory(catId, positionId){
  const hist = STATE.data[catId].history.filter(h=>h.positionId===positionId).sort((a,b)=>a.data.localeCompare(b.data)||a.id.localeCompare(b.id));
  let qtd=0, precoMedio=0;
  hist.forEach(h=>{
    if (h.tipo==='compra'){
      const novoQtd = qtd + h.qtd;
      precoMedio = novoQtd>0 ? ((qtd*precoMedio)+(h.qtd*h.preco))/novoQtd : 0;
      qtd = novoQtd;
    } else {
      qtd = Math.max(0, qtd - h.qtd);
      if (qtd===0) precoMedio = 0;
    }
  });
  const pos = STATE.data[catId].positions.find(p=>p.id===positionId);
  if (pos){ pos.qtd = qtd; pos.precoMedio = precoMedio; }
}

const overlay = document.getElementById('overlay');

function modalHasUnsavedInput(){
  const inputs = modalBody.querySelectorAll('input[type=text], input[type=number], input[type=email], input[type=password]');
  for (const inp of inputs){ if (inp.value && inp.value.trim() !== '') return true; }

}
function closeModal(){ overlay.classList.remove('open'); modalBody.innerHTML=''; }
function closeModalGuarded(){
  if (modalHasUnsavedInput() && !confirm('Você preencheu informações que ainda não foram salvas. Descartar?')) return;
  closeModal();
}
overlay.addEventListener('click', (e)=>{ if (e.target===overlay) closeModalGuarded(); });

  overlay.classList.add('open');
}

function submitAddPosition(catId){
  const ticker = document.getElementById('f-ticker').value.trim().toUpperCase();
  const qtd = parseFloat(document.getElementById('f-qtd').value);
  const preco = parseFloat(document.getElementById('f-preco').value);
  const data = document.getElementById('f-data').value || todayISO();
  if (!ticker || !qtd || !preco) return alert('Preencha todos os campos.');
  let pos = STATE.data[catId].positions.find(p=>p.ticker===ticker);
  if (!pos){ pos = {id:uid(), ticker, qtd:0, precoMedio:0, precoAtual:preco}; STATE.data[catId].positions.push(pos); }
  STATE.data[catId].history.push({id:uid(), positionId:pos.id, tipo:'compra', qtd, preco, data});
  recalcPositionFromHistory(catId, pos.id);
  pos.precoAtual = preco;
  closeModal(); persist();
  autoUpdateQuoteForPosition(catId, pos.id);
}

    `);
    return;
  }
  const titles = { compra:'Registrar compra', venda:'Registrar venda' };
  openModal(`
    <div class="modal-head"><h3>${titles[tipo]}</h3><button class="close" onclick="closeModalGuarded()"><span class="material-symbols-outlined icn-sm">close</span></button></div>

    <button class="btn" style="width:100%" onclick="submitTx('${catId}','${refId}','${tipo}')">Salvar</button>
  `);
}

function submitTx(catId, refId, tipo){
  const cat = STATE.categories.find(c=>c.id===catId);
  const data = document.getElementById('f-data').value || todayISO();

  if (cat.type === 'saldo'){
    const valor = parseFloat(document.getElementById('f-valor').value);
    if (!valor) return alert('Informe o valor.');
    STATE.data[catId].moves.push({id:uid(), itemId:refId, tipo, valor, data});
    const item = STATE.data[catId].items.find(i=>i.id===refId);
    const novoSaldoEl = document.getElementById('f-novo-saldo');
    const novoSaldo = novoSaldoEl ? parseFloat(novoSaldoEl.value) : NaN;
    if (!isNaN(novoSaldo) && novoSaldo >= 0){
      item.saldoAtual = novoSaldo;
    } else {
      item.saldoAtual = tipo==='entrada' ? (item.saldoAtual||0)+valor : Math.max(0,(item.saldoAtual||0)-valor);
    }
    if (catId === 'fgts' && tipo === 'entrada'){
      item.totalDepositado = (item.totalDepositado||0) + valor;
    }
    closeModal(); persist(); return;
  }

  const qtd = parseFloat(document.getElementById('f-qtd').value);
  const preco = parseFloat(document.getElementById('f-preco').value);
  if (!qtd || !preco) return alert('Preencha todos os campos.');
  const pos = STATE.data[catId].positions.find(p=>p.id===refId);
  if (tipo==='venda' && qtd > pos.qtd) return alert('Quantidade maior que a posição atual.');
  STATE.data[catId].history.push({id:uid(), positionId:refId, tipo, qtd, preco, data});
  recalcPositionFromHistory(catId, refId);
  if (tipo==='compra') pos.precoAtual = preco;
  closeModal(); persist();
  if (tipo==='compra') autoUpdateQuoteForPosition(catId, refId);
}

function escapeHtmlLite(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function buildHoldingsRows(){
  const rows = [];
  STATE.categories.forEach(cat=>{
    if (cat.type === 'market'){
      (STATE.data[cat.id].positions||[]).forEach(p=>{
        const m = calcPositionMetrics(p);
        if (m.atual<=0 && m.investido<=0) return;
        rows.push({
          nome: p.ticker, sub:'', catLabel: cat.label, catColor: cat.color,
          qtd: p.qtd, precoMedio: p.precoMedio, precoAtual: p.precoAtual,
          investido: m.investido, atual: m.atual, resultado: m.resultado, pct: m.pct
        });
      });
    } else {
      (STATE.data[cat.id].items||[]).forEach(it=>{
        let investido = 0;
        (STATE.data[cat.id].moves||[]).filter(mv=>mv.itemId===it.id).forEach(mv=>{
          investido += (mv.tipo==='entrada' ? mv.valor : -mv.valor);
        });
        const atual = it.saldoAtual||0;
        const resultado = atual-investido;
        if (atual<=0 && investido<=0) return;
        rows.push({
          nome: it.nome, sub: it.subtitulo||'', catLabel: cat.label, catColor: cat.color,
          qtd:null, precoMedio:null, precoAtual:null,
          investido, atual, resultado, pct: investido>0 ? (resultado/investido*100) : 0
        });
      });
    }
  });
  rows.sort((a,b)=>b.atual-a.atual);
  return rows;
}

function importBackup(evt){
  const file = evt.target.files[0];
  if (!file) return;
  if (!confirm('Importar vai substituir todos os dados atuais neste aparelho. Continuar?')){ evt.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = normalizeState(JSON.parse(reader.result));
      STATE = parsed;
      ACTIVE_TAB = STATE.categories[0]?.id || 'acoes';
      closeModal();
      persist();
    }catch(e){ alert('Não foi possível ler esse arquivo. Confira se é um backup válido.'); }
    evt.target.value = '';
  };
  reader.readAsText(file);
}

const COINGECKO_IDS = { BTC:'bitcoin', ETH:'ethereum', SOL:'solana', ADA:'cardano', XRP:'ripple', DOGE:'dogecoin', BNB:'binancecoin', USDT:'tether', MATIC:'matic-network', LTC:'litecoin', TRX:'tron', DOT:'polkadot', AVAX:'avalanche-2' };

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }
function shuffleArray(arr){
  const a = [...arr];
  for (let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// Tenta cada token em ordem aleatória — se um falhar (limite atingido, erro etc.), tenta o próximo.
async function fetchBrapiQuote(ticker, tokens){
  const pool = (tokens && tokens.length) ? shuffleArray(tokens) : [null];
  for (const token of pool){
    try{
      const url = `https://brapi.dev/api/quote/${ticker}` + (token ? `?token=${encodeURIComponent(token)}` : '');
      const res = await fetch(url);
      if (!res.ok) continue;
      const json = await res.json();
      const r = (json.results||[])[0];
      if (r && r.regularMarketPrice) return r.regularMarketPrice;
    }catch(e){ /* tenta o próximo token do pool */ }
  }
  return null;
}

// Busca a cotação atual de um único ativo logo após um aporte, pra que o
// rendimento já reflita a variação real de mercado em vez do preço de custo.
async function autoUpdateQuoteForPosition(catId, posId){
  const pos = STATE.data[catId] && STATE.data[catId].positions.find(p=>p.id===posId);
  if (!pos) return;
  let preco = null;
  if (catId === 'crypto'){
    const cgId = COINGECKO_IDS[pos.ticker.toUpperCase()];
    if (cgId){
      try{
        const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${cgId}&vs_currencies=brl`);
        const json = await res.json();
        if (json[cgId] && json[cgId].brl) preco = json[cgId].brl;
      }catch(e){ /* mantém preço de custo como fallback */ }
    }
  } else {
    preco = await fetchBrapiQuote(pos.ticker, STATE.settings.brapiTokens||[]);
  }
  if (preco){
    pos.precoAtual = preco;
    pos.atualizadoEm = new Date().toISOString();
    await DB.save(STATE);
    renderAll();
  }
}

async function fetchAllQuotes(){
  const statusEl = document.getElementById('quotesStatus');
  const tokens = STATE.settings.brapiTokens || [];

  // Ações/FIIs (e outras guias tipo "mercado" que não sejam crypto), sempre começando
  // pelo ativo cuja cotação está há mais tempo sem atualizar.
  const brapiCats = STATE.categories.filter(c=>c.type==='market' && c.id!=='crypto');
  let brapiPositions = [];
  brapiCats.forEach(cat=>{
    STATE.data[cat.id].positions.forEach(pos=> brapiPositions.push(pos));
  });
  brapiPositions.sort((a,b)=> (a.atualizadoEm||'').localeCompare(b.atualizadoEm||''));

  let updated = 0; const failed = [];

  for (let i=0; i<brapiPositions.length; i++){
    const pos = brapiPositions[i];
    if (statusEl) statusEl.textContent = `Atualizando ${i+1} de ${brapiPositions.length} — ${pos.ticker}...`;
    const preco = await fetchBrapiQuote(pos.ticker, tokens);
    if (preco){ pos.precoAtual = preco; pos.atualizadoEm = new Date().toISOString(); updated++; }
    else failed.push(pos.ticker);
    if (i < brapiPositions.length-1) await sleep(280);
  }

  // Crypto via CoinGecko (não usa token)
  if (STATE.data.crypto){
    const positions = STATE.data.crypto.positions;
    const ids = [...new Set(positions.map(p=>COINGECKO_IDS[p.ticker.toUpperCase()]).filter(Boolean))];
    if (ids.length){
      if (statusEl) statusEl.textContent = 'Atualizando crypto...';
      try{
        const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids.join(',')}&vs_currencies=brl`);
        const json = await res.json();
        positions.forEach(p=>{
          const cgId = COINGECKO_IDS[p.ticker.toUpperCase()];
          if (cgId && json[cgId] && json[cgId].brl){ p.precoAtual = json[cgId].brl; p.atualizadoEm = new Date().toISOString(); updated++; }
          else if (cgId) failed.push(p.ticker);
        });
      }catch(e){ failed.push('Crypto'); }
    }
  }

  if (statusEl){
    statusEl.textContent = updated>0
      ? `${updated} cotação(ões) atualizada(s).${failed.length ? ' Sem sucesso: '+failed.join(', ') : ''}`
      : `Não foi possível atualizar agora.${failed.length ? ' ('+failed.join(', ')+')' : ''}`;
  }
  persist();
}

/* =========================================================
   AUTENTICAÇÃO / SYNC NA NUVEM
========================================================= */
function setSyncBadge(mode, label){
  const badge = document.getElementById('syncBadge');
  const icon = document.getElementById('syncIcon');
  if (mode === 'synced'){ badge.classList.add('synced'); icon.textContent='cloud_done'; badge.title = 'Conectado: '+(label||''); }
  else if (mode === 'erro'){ badge.classList.remove('synced'); icon.textContent='cloud_off'; badge.title='Erro de sincronização'; }
  else { badge.classList.remove('synced'); icon.textContent='cloud'; badge.title='Local — toque para entrar'; }
}

let AUTH_MODE = 'login';
function openAuthOverlay(){
  const overlayEl = document.getElementById('authOverlay');
  const body = document.getElementById('authModalBody');
  if (CURRENT_UID){
    body.innerHTML = `
      <div class="modal-head"><h3>Sua conta</h3><button class="close" onclick="closeAuthOverlay()"><span class="material-symbols-outlined icn-sm">close</span></button></div>
      <p style="font-size:13.5px; color:var(--muted); margin-top:-6px;">Conectado como <b style="color:var(--cream)">${CURRENT_USER_EMAIL||''}</b>. Seus dados sincronizam automaticamente entre aparelhos.</p>
      <button class="btn danger" style="width:100%; margin-top:6px" onclick="doLogout()">Sair da conta</button>
    `;
  } else {
    AUTH_MODE = 'login';
    body.innerHTML = `
      <div class="modal-head"><h3>Entrar</h3><button class="close" onclick="closeAuthOverlay()"><span class="material-symbols-outlined icn-sm">close</span></button></div>
      <div class="seg" id="authSeg">
        <button class="active" data-mode="login" onclick="setAuthMode('login')">Entrar</button>
        <button data-mode="signup" onclick="setAuthMode('signup')">Criar conta</button>
      </div>
      <div class="field-group"><label class="field">E-mail</label><input type="email" id="auth-email" placeholder="voce@email.com" autocomplete="email"></div>
      <div class="field-group"><label class="field">Senha</label><input type="password" id="auth-senha" placeholder="••••••••" autocomplete="current-password"></div>
      <div id="authError" style="display:none; color:#FF5C7A; font-size:12.5px; margin:-4px 0 12px;"></div>
      <button class="btn" style="width:100%" id="authSubmitBtn" onclick="submitAuth()">Entrar</button>
      <button class="btn ghost" style="width:100%; margin-top:8px" onclick="closeAuthOverlay()">Continuar sem login (só neste aparelho)</button>
    `;
  }
  overlayEl.classList.add('open');
}
function closeAuthOverlay(){ document.getElementById('authOverlay').classList.remove('open'); }
function setAuthMode(mode){
  AUTH_MODE = mode;
  document.querySelectorAll('#authSeg button').forEach(b=>b.classList.toggle('active', b.dataset.mode===mode));
  document.getElementById('authSubmitBtn').textContent = mode==='login' ? 'Entrar' : 'Criar conta';
}
async function submitAuth(){
  const email = document.getElementById('auth-email').value.trim();
  const senha = document.getElementById('auth-senha').value;
  const errEl = document.getElementById('authError');
  errEl.style.display = 'none';
  if (!email || !senha){ errEl.textContent='Preencha e-mail e senha.'; errEl.style.display='block'; return; }
  if (!window.CloudSync){ errEl.textContent='Sincronização ainda carregando, tente novamente em instantes.'; errEl.style.display='block'; return; }
  try{
    if (AUTH_MODE==='login') await window.CloudSync.login(email, senha);
    else await window.CloudSync.cadastrar(email, senha);
    closeAuthOverlay();
  }catch(e){ errEl.textContent = traduzErroAuth(e); errEl.style.display='block'; }
}
function traduzErroAuth(e){
  const map = {
    'auth/invalid-email':'E-mail inválido.', 'auth/user-not-found':'Usuário não encontrado.',
    'auth/wrong-password':'Senha incorreta.', 'auth/invalid-credential':'E-mail ou senha incorretos.',
    'auth/email-already-in-use':'Esse e-mail já tem cadastro. Tente entrar.', 'auth/weak-password':'Senha muito curta (mínimo 6 caracteres).',
  };
  return map[e && e.code] || 'Não foi possível autenticar. Tente novamente.';
}
async function doLogout(){ if (window.CloudSync) await window.CloudSync.logout(); closeAuthOverlay(); }

window.addEventListener('cloudsync-pronto', () => {
  window.CloudSync.onAuthStateChanged(async (user) => {
    if (window.CloudSync.pararDeOuvir) window.CloudSync.pararDeOuvir();
    if (user){
      CURRENT_UID = user.uid;
      CURRENT_USER_EMAIL = user.email;
      setSyncBadge('synced', user.email.split('@')[0]);

      const nuvem = await window.CloudSync.buscarDaNuvem(user.uid).catch(()=>null);
      if (nuvem) STATE = normalizeState(nuvem);
      else if (STATE) await DB.save(STATE);
      renderAll();

      window.CloudSync.ouvirMudancas(user.uid, (dados) => {
        if (SUPPRESS_NEXT_SNAPSHOT){ SUPPRESS_NEXT_SNAPSHOT=false; return; }
        STATE = normalizeState(dados);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
        renderAll();
      });
    } else {
      CURRENT_UID = null; CURRENT_USER_EMAIL = null;
      setSyncBadge('local');
    }
  });
});

/* =========================================================
   TABS + FAB + BOTÕES DE AÇÃO
========================================================= */
document.getElementById('tabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  if (btn.dataset.tab === '__add__'){ openAddCategoryModal(); return; }
  if (btn.dataset.tab !== ACTIVE_TAB) OPEN_ROWS.clear();
  ACTIVE_TAB = btn.dataset.tab;
  renderAll();
});
document.getElementById('fabAdd').addEventListener('click', ()=> openAddModal(ACTIVE_TAB));
document.getElementById('btnBlur').addEventListener('click', toggleBlur);
document.getElementById('btnDashboard').addEventListener('click', openDashboard);
document.getElementById('btnTools').addEventListener('click', openTools);
window.addEventListener('scroll', handleScroll, {passive:true});

/* =========================================================
   PWA install
========================================================= */
if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

/* =========================================================
   INIT
========================================================= */
(async function init(){
  STATE = await DB.load();
  initBlurPref();
  renderAll();
  DB.save(STATE);
})();
</script>
