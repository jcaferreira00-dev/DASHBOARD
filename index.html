<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14342b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carteira">
<title>Carteira</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico">
<style>
:root{--bg:#f5f3ee;--card:#fffefb;--ink:#17201c;--mut:#6b746e;--line:#e4e0d6;--acc:#14342b;--gold:#b08d57;--up:#2f7a56;--dn:#b3402a;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0f1512;--card:#161d19;--ink:#ece9e1;--mut:#8f9a93;--line:#26302b;--acc:#7fb89c;--gold:#c9a56b;--up:#6fc29a;--dn:#e0806a;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
body.bl .m{filter:blur(8px)}
.w{width:100%;max-width:1040px;margin:0 auto;padding:0 20px}
header{padding-top:18px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.lb{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut)}
.tot{font:300 46px/1.05 "SF Pro Display","Segoe UI Variable Display","Segoe UI","Helvetica Neue",Arial,sans-serif;letter-spacing:-.035em;font-variant-numeric:lining-nums tabular-nums;margin-top:2px}
.cu{font-size:.36em;font-weight:500;letter-spacing:.06em;color:var(--mut);margin-right:.45em;vertical-align:.95em}
.ce{font-size:.42em;font-weight:400;color:var(--mut);letter-spacing:0}
@media(max-width:520px){.tot{font-size:38px}}
.sr{font:500 22px/1.2 -apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:-.02em;font-variant-numeric:lining-nums tabular-nums}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
@media(prefers-color-scheme:dark){button.p{color:#0f1512}}
button.g{border:0;background:none;color:var(--mut);padding:6px 8px}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ib{width:36px;height:36px;padding:0;display:inline-grid;place-items:center;border:0;background:none;color:var(--mut);border-radius:8px}
.ib:hover{background:var(--bg);color:var(--ink)}.ib.d:hover{color:var(--dn)}.ib.on{color:var(--acc)}.ib:disabled{opacity:.3;cursor:default}
.ib.p{width:40px;height:40px;border-radius:50%;background:var(--acc);color:#fff}
@media(prefers-color-scheme:dark){.ib.p{color:#0f1512}}
svg.i,.ib svg,.icn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transform:none}
.icn{display:inline-flex;align-items:center;gap:6px}.icn span{display:inline-flex}
.ib.wr{color:var(--gold)}
.sw,.ck input.tg{appearance:none;-webkit-appearance:none;position:relative;width:34px;height:20px;padding:0;margin:0;border-radius:99px;background:var(--line);border:0;cursor:pointer;flex:none;transition:background .2s}
.sw::after,.ck input.tg::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on,.ck input.tg:checked{background:var(--acc)}.sw.on::after,.ck input.tg:checked::after{left:16px}
.lgr.sel{background:var(--bg);font-weight:600}
.ck{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px}.ck input{width:auto;margin:0}
.inl{display:inline-block;width:104px;margin:0;padding:3px 6px;text-align:right;font-size:14px;background:transparent;border:1px solid transparent;border-radius:6px}
.inl:hover,.inl:focus{border-color:var(--line);background:var(--bg);outline:0}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chip svg.i{width:12px;height:12px;margin-left:4px;vertical-align:-1px}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.dh h3{margin:0}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:16px;border-bottom:1px solid var(--line);scrollbar-width:none}
nav button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mut);padding:10px 14px;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--gold);font-weight:600}
main{flex:1;min-height:0;overflow:auto;padding:20px 0 28px}
.grid{display:grid;gap:14px;grid-template-columns:1.15fr 1fr}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h4{margin:0 0 12px;font:600 12px sans-serif;text-transform:uppercase;letter-spacing:.09em;color:var(--mut)}
.dnw{position:relative;width:200px;height:200px;flex:none}
.dn{width:100%;height:100%;transform:rotate(-90deg)}.dn circle{transition:opacity .2s;cursor:pointer}
.dc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;padding:0 34px}
.dcv{font:300 24px/1.2 "SF Pro Display","Segoe UI Variable Display","Segoe UI","Helvetica Neue",Arial,sans-serif;letter-spacing:-.03em;font-variant-numeric:lining-nums tabular-nums}
.dc .lb{margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
.kpi:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 10px 26px -16px rgba(0,0,0,.45)}
.kv{font:400 25px/1.2 -apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:-.02em;margin:5px 0 2px;font-variant-numeric:lining-nums tabular-nums}
.kpi .bar{margin:8px 0 6px}
.ins{display:flex;gap:12px;align-items:flex-start;padding:14px 4px;border-bottom:1px solid var(--line)}.ins:last-child{border:0}
.ins .dot{margin-top:7px}.ins.alerta .dot{background:var(--gold)}.ins.info .dot{background:var(--mut)}.ins.ok .dot{background:var(--up)}
.ins .n{flex:1;min-width:0}.ins .n div{font-size:13px;color:var(--mut);margin-top:2px}
.sum{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.lg{flex:1;min-width:200px}
.lgr{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:8px;padding:8px 6px;text-align:left}
.lgr:hover{background:var(--bg)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.lgr span.n{flex:1}.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.up{color:var(--up)}.dnc{color:var(--dn)}
.bar{height:7px;background:var(--line);border-radius:9px;overflow:hidden;margin:7px 0 4px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.bar.g i{background:var(--gold)}
.goal{margin-bottom:16px}.goal:last-child{margin:0}
.goal div.h{display:flex;justify-content:space-between;gap:8px}
.stack{display:flex;height:12px;border-radius:9px;overflow:hidden;gap:2px;margin:12px 0 10px}
.stack i{display:block;height:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:5px 12px;border-radius:99px;font-size:13px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
@media(prefers-color-scheme:dark){.chip.on{color:#0f1512}}
.row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--bg)}
.row .n{flex:1;min-width:0}.row .n b{font-weight:500}
.row .r{text-align:right}
.pg{display:flex;justify-content:center;align-items:center;gap:10px;padding-top:12px;font-size:13px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:500 11px sans-serif;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:11px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}
.sc{overflow-x:auto}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border:0}
.step .k{width:24px;height:24px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-size:12px;flex:none;margin-top:2px}
.step .n{flex:1}
.fld{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.fld label{flex:1;min-width:140px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:12px}
input,select{display:block;width:100%;margin-top:4px;font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
td input{width:76px;margin:0;padding:5px 7px;text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;margin-bottom:14px}
.seg button{border-radius:0}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
@media(prefers-color-scheme:dark){.seg button.on{color:#0f1512}}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:22px;width:min(460px,93vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{font:600 20px Georgia,serif;margin:0 0 14px}
.ac{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap}
.st{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.note{font-size:12.5px;color:var(--mut);margin-top:12px}
.emp{text-align:center;padding:36px 10px;color:var(--mut)}
</style>
</head>
<body>
<header><div class="w">
  <div class="top">
    <div><div class="lb">Patrimônio consolidado, sem FGTS</div><div class="tot num m" id="tot"></div></div>
    <div class="acts"><button class="ib" id="eye" onclick="blur_()" title="Ocultar valores" aria-label="Ocultar valores" data-i="eye"></button><button class="ib" title="Ajustes" aria-label="Ajustes" data-i="tune" onclick="$('dAj').showModal();ajUI()"></button><button class="ib" id="cta" title="Conta e sincronização" aria-label="Conta" data-i="user" onclick="$('dCt').showModal()"></button><button class="p icn" onclick="openLan()" title="Novo lançamento"><span data-i="plus"></span>Lançar</button></div>
  </div>
  <nav id="tabs"></nav>
</div></header>
<main><div class="w" id="v"></div></main>

<dialog id="dLan"></dialog>
<dialog id="dDet"></dialog>
<dialog id="dAj"></dialog>
<dialog id="dMt"></dialog>
<dialog id="dCt"><div class="dh"><h3>Conta e sincronização</h3><button class="ib" onclick="$('dCt').close()" title="Fechar" aria-label="Fechar" data-i="x"></button></div>
<div id="ctS" class="note" style="margin:0 0 12px"></div>
<label>E-mail<input id="ctE" type="email"></label><label>Senha<input id="ctP" type="password"></label>
<div id="ctM" class="note" style="color:var(--dn);margin:0 0 8px"></div>
<div class="ac"><button onclick="auth('sair')">Sair</button><button onclick="auth('cad')">Criar conta</button><button class="p" onclick="auth('in')">Entrar</button></div></dialog>

<script type="module" src="cloud-sync.js"></script>
<script>
const KEY='carteira_v1',$=i=>document.getElementById(i);
const R=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const P=v=>(v||0).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
const N=(v,d=2)=>(v||0).toLocaleString('pt-BR',{maximumFractionDigits:d});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const iso=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC={plus:'<path d="M12 5v14M5 12h14"/>',tune:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',eyeoff:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',pencil:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',refresh:'<path d="M20 11a8 8 0 0 0-14-4M4 4v4h4M4 13a8 8 0 0 0 14 4M20 20v-4h-4"/>',left:'<path d="M15 6l-6 6 6 6"/>',right:'<path d="M9 6l6 6-6 6"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
document.querySelectorAll('[data-i]').forEach(b=>b.innerHTML=ic(b.dataset.i));
let S,TAB='resumo',PGN={},UID=null,L={},AS={v:null,d:365,n:0,tab:'diag',all:0};
const DEF=()=>({categories:[
 {id:'acoes',label:'Ações',color:'#3B9EFF',type:'market',unit:'ação',builtIn:true},
 {id:'fiis',label:'FIIs',color:'#12D18E',type:'market',unit:'FII',builtIn:true},
 {id:'previdencia',label:'Previdência',color:'#E0B84C',type:'saldo',unit:'plano',builtIn:true,entradaLabel:'Aporte',saidaLabel:null,rendMode:'manual'},
 {id:'crypto',label:'Crypto',color:'#B14EFF',type:'market',unit:'ativo',builtIn:true},
 {id:'fgts',label:'FGTS',color:'#1EC9C9',type:'saldo',unit:'conta',builtIn:true,entradaLabel:'Depósito',saidaLabel:'Saque',rendMode:'fixed',taxaAnual:.03}],
 data:{acoes:{positions:[],history:[]},fiis:{positions:[],history:[]},previdencia:{items:[],moves:[]},crypto:{positions:[],history:[]},fgts:{items:[],moves:[]}},
 settings:{},wealthHistory:[]});
function ens(s){if(!s||!s.categories||!s.data)s=DEF();
 const t=s.settings=Object.assign({metaAnual:50000,investidoAno:0,renda:0,aliq:27.5,pgblAporte:0,metaReserva:0,custoMensal:0,mesesReserva:6,rescisao:0,livre:0,brapiTokens:[],refs:{}},s.settings||{});
 if(t.pgblAno&&!t.pgblAporte)t.pgblAporte=t.pgblAno.valor||0;delete t.pgblAno;
 t.taxas=Object.assign({cdi:14.5,selic:0,ipca:0,usd:0,em:'',at:0},t.taxas||{});
 s.wealthHistory=s.wealthHistory||[];s.updatedAt=s.updatedAt||0;return s}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=ens(S);
const cat=id=>S.categories.find(c=>c.id===id);
const isM=c=>c.type==='market';
const isRF=c=>isM(c)&&/renda|cdb|tesouro/i.test(c.label);
const FX=()=>S.settings.taxas.usd||1,fxp=p=>p.moeda==='USD'?FX():1;
const money=v=>{const[a,b]=(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).split(',');return`<span class="cu">R$</span>${a}<span class="ce">,${b}</span>`};
function items(c){const d=S.data[c.id]||{};
 if(isM(c))return(d.positions||[]).map(p=>{const f=fxp(p),u=p.moeda==='USD';return{id:p.id,nome:p.ticker,inst:p.inst||'',res:p.reservaTipo==='emergencia',at:p.qtd*p.precoAtual*f,inv:p.qtd*p.precoMedio*f,sub:[isRF(c)?(p.reservaTipo?'Reserva de '+(p.reservaTipo==='emergencia'?'emergência':'oportunidade'):''):N(p.qtd,4)+' un',u?'US$ '+N(p.precoAtual)+' · cotação '+N(FX()):''].filter(Boolean).join(' · ')}}).filter(x=>x.at>0||x.inv>0);
 return(d.items||[]).map(i=>{let inv=0;(d.moves||[]).filter(m=>m.itemId===i.id).forEach(m=>inv+=m.tipo==='entrada'?m.valor:-m.valor);const w=(i.pct==null?100:i.pct)/100;return{id:i.id,nome:i.nome,inst:i.inst||'',at:(i.saldoAtual||0)*w,inv:inv*w,sub:w<1?'Saldo '+R(i.saldoAtual)+' · conta '+N(w*100,1)+'% no total':''}})}
const all=()=>S.categories.filter(c=>c.id!=='fgts').flatMap(c=>items(c).map(x=>({...x,cid:c.id,cl:c.label,color:c.color})));
const kI=x=>x.inst||'Sem instituição';
const insts=()=>[...new Set(S.categories.flatMap(c=>{const d=S.data[c.id]||{};return(d.positions||d.items||[]).map(x=>x.inst)}).filter(Boolean))];
const tot=c=>items(c).reduce((s,x)=>s+x.at,0);
const grand=()=>all().reduce((s,x)=>s+x.at,0);
function aportes(){const s=S.settings;return{t:s.investidoAno||0,pg:s.pgblAporte||0}}
function reserva(){let at=0,meta=S.settings.metaReserva||0;
 S.categories.forEach(c=>{if(isM(c))(S.data[c.id].positions||[]).forEach(p=>{if(p.reservaTipo==='emergencia')at+=p.qtd*p.precoAtual*fxp(p)});if(!meta&&c.metaReservaEmergencia)meta=c.metaReservaEmergencia});return{at,meta}}
const rfCat=()=>S.categories.find(isRF)||S.categories.find(isM)||S.categories[0];

async function save(silent){const g=grand(),h=S.wealthHistory,t=iso();
 if(h.length&&h[h.length-1].data===t)h[h.length-1].valor=g;else h.push({data:t,valor:g});if(h.length>180)h.splice(0,h.length-180);
 if(!silent){S.updatedAt=clk();pend=!!UID}
 localStorage.setItem(KEY,JSON.stringify(S));render();if(!silent)push()}
function blur_(){document.body.classList.toggle('bl');const b=document.body.classList.contains('bl');localStorage.setItem('cb',b?1:0);$('eye').innerHTML=ic(b?'eyeoff':'eye');$('eye').title=b?'Mostrar valores':'Ocultar valores'}
if(localStorage.getItem('cb')==='1')blur_();

/* ---------- Tela ---------- */
function render(){
 $('tot').innerHTML=money(grand());
 const tabs=[['resumo','Resumo'],['assist','Assistente'],...S.categories.map(c=>[c.id,c.label])];
 if(!tabs.some(t=>t[0]===TAB))TAB='resumo';
 $('tabs').innerHTML=tabs.map(t=>`<button class="${t[0]===TAB?'on':''}" onclick="go('${t[0]}')">${esc(t[1])}</button>`).join('');
 $('v').innerHTML=TAB==='resumo'?vResumo():TAB==='assist'?vAssist():vGuia(cat(TAB));
 stUI()}
function go(t){TAB=t;render();$('v').parentNode.scrollTop=0}
function donut(sg,t,cl,cv){let o=0,h='';sg.forEach((x,i)=>{const f=t?x.v/t*100:0,w=Math.max(0,f-(sg.length>1?.6:0));h+=`<circle data-i="${i}" r="15.915" cx="21" cy="21" fill="none" stroke="${x.c}" opacity="${x.o==null?1:x.o}" stroke-width="3.4" stroke-dasharray="${w} ${100-w}" stroke-dashoffset="${-o}" onmouseenter="hv(${i})" onmouseleave="hv(-1)" onclick="fl(${i})"/>`;o+=f});
 return`<div class="dnw"><svg viewBox="0 0 42 42" class="dn"><circle r="15.915" cx="21" cy="21" fill="none" stroke="var(--line)" stroke-width="3.4" style="cursor:default"/>${h}</svg><div class="dc"><div class="lb" id="dcl">${esc(cl)}</div><div class="dcv m" id="dcv">${cv}</div></div></div>`}
let DC={l:'',v:'',t:1};
function hv(i){const l=$('dcl'),v=$('dcv');if(!l)return;const x=LG[i];document.querySelectorAll('.dn circle[data-i]').forEach(c=>c.style.opacity=i<0?'':(+c.dataset.i===i?1:.25));
 if(i<0||!x){l.textContent=DC.l;v.innerHTML=DC.v}else{l.textContent=x.n;v.innerHTML=money(x.v)+`<div class="mut" style="font-size:12px;letter-spacing:0;font-weight:400">${P(x.v/DC.t*100)}</div>`}}
let F={by:'guia',cat:null,inst:null},LG=[];
const PAL=['#3B9EFF','#12D18E','#E0B84C','#B14EFF','#1EC9C9','#E07A5F','#8D99AE','#F2A65A'];
function fl(i){const x=LG[i],k=F.by==='guia'?'cat':'inst';F[k]=F[k]===x.id?null:x.id;render()}
function vResumo(){const A=all(),g=A.reduce((x,y)=>x+y.at,0),fg=cat('fgts')?tot(cat('fgts')):0,gr=F.by==='guia';
 if(F.cat&&!cat(F.cat))F.cat=null;
 const base=A.filter(x=>gr?(!F.inst||kI(x)===F.inst):(!F.cat||x.cid===F.cat)),m={};
 base.forEach(x=>{const k=gr?x.cid:kI(x);(m[k]=m[k]||{n:gr?x.cl:k,v:0,id:k,c:x.color}).v+=x.at});

async function taxas(){const t=S.settings.taxas,g=async(n,k)=>{try{return await bcb(n)}catch(e){return t[k]}};
 try{const[cdi,selic,ipca,usd]=await Promise.all([g(4389,'cdi'),g(432,'selic'),g(13522,'ipca'),g(1,'usd')]);Object.assign(t,{cdi,selic,ipca,usd,at:Date.now(),em:new Date().toLocaleDateString('pt-BR')});return true}catch(e){return false}}
async function quote(t){const k=S.settings.brapiTokens||[],pool=k.length?[...k].sort(()=>Math.random()-.5):[null];
 for(const x of pool){try{const r=await fetch('https://brapi.dev/api/quote/'+t+(x?'?token='+encodeURIComponent(x):''));if(!r.ok)continue;const j=(await r.json()).results[0];if(j&&j.regularMarketPrice)return j.regularMarketPrice}catch(e){}}return null}
async function cotar(p){if(p.moeda==='USD')return;const v=await quote(p.ticker);if(v){p.precoAtual=v;p.atualizadoEm=new Date().toISOString();save(true)}}
async function atualizar(){const b=$('bt');if(b){b.disabled=true;b.style.opacity=.4}
 const ok=await taxas();for(const id of['acoes','fiis']){if(!cat(id))continue;for(const p of S.data[id].positions||[]){if(p.moeda==='USD')continue;const v=await quote(p.ticker);if(v){p.precoAtual=v;p.atualizadoEm=new Date().toISOString()}}}
 await save(true);if(!ok)alert('Não foi possível consultar o Banco Central agora.')}
/* ---------- Conta ---------- */
async function auth(a){const e=$('ctE').value.trim(),p=$('ctP').value,m=$('ctM');m.textContent='';
 if(!window.CloudSync){m.textContent='Sincronização ainda carregando. Tente novamente.';return}
 try{if(a==='sair'){await CloudSync.logout();$('dCt').close();return}if(a==='in')await CloudSync.login(e,p);else await CloudSync.cadastrar(e,p);$('dCt').close()}catch(x){m.textContent='Não foi possível concluir. Verifique e-mail e senha.'}}
let sk=0,pend=false,st='local',lastSync=0,pt;
const clk=()=>Math.max(Date.now()+sk,(S.updatedAt||0)+1);
function stUI(){const b=$('cta');if(!b)return;const t={ok:'Sincronizado'+(lastSync?' às '+new Date(lastSync).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):''),pend:'Sincronização pendente',off:'Sem conexão: alterações guardadas neste aparelho',err:'Falha ao sincronizar, nova tentativa em instantes',local:'Dados salvos apenas neste aparelho'};b.title=t[st];b.classList.toggle('on',st==='ok');b.classList.toggle('wr',st==='pend'||st==='off'||st==='err')}
function setSt(x){st=x;stUI()}
function push(){clearTimeout(pt);pt=setTimeout(doPush,400)}
async function doPush(){if(!UID||!window.CloudSync||!pend)return;if(!navigator.onLine)return setSt('off');
 const v=S.updatedAt;try{await CloudSync.salvarNaNuvem(UID,S);if(S.updatedAt===v)pend=false;lastSync=Date.now();setSt(pend?'pend':'ok')}catch(e){setSt('err')}}
function remote(d,login){d=ens(d);const r=d.updatedAt||0,l=S.updatedAt||0;
 if(r>l||(login&&r===l&&!r)){if(JSON.stringify(d)!==JSON.stringify(S))localStorage.setItem('carteira_bak',JSON.stringify(S));S=d;pend=false;localStorage.setItem(KEY,JSON.stringify(S));lastSync=Date.now();setSt('ok');render()}
 else if(r<l){pend=true;doPush()}else{lastSync=Date.now();setSt(pend?'pend':'ok')}}
async function pull(){if(!UID||!window.CloudSync||!navigator.onLine)return;try{const n=await CloudSync.buscarDaNuvem(UID);if(n)remote(n)}catch(e){setSt('err')}}
async function clock(){try{const a=Date.now(),r=await fetch('https://worldtimeapi.org/api/timezone/Etc/UTC',{cache:'no-store'}),j=await r.json(),b=Date.now();sk=j.unixtime*1000+(b-a)/2-b}catch(e){}}
window.addEventListener('cloudsync-pronto',()=>{CloudSync.onAuthStateChanged(async u=>{if(CloudSync.pararDeOuvir)CloudSync.pararDeOuvir();
 if(u){UID=u.uid;$('ctS').textContent='Conectado como '+u.email;setSt('pend');const n=await CloudSync.buscarDaNuvem(u.uid).catch(()=>null);if(n)remote(n,true);else{pend=true;await doPush()}render();
  CloudSync.ouvirMudancas(u.uid,d=>remote(d))}
 else{UID=null;pend=false;$('ctS').textContent='Dados salvos apenas neste aparelho.';setSt('local');render()}})});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){pull();doPush()}});
addEventListener('online',()=>{pull();doPush()});addEventListener('offline',()=>setSt('off'));
addEventListener('pagehide',()=>{if(pend)doPush()});
setInterval(()=>{if(pend)doPush();else pull()},60000);
$('ctS').textContent='Dados salvos apenas neste aparelho.';
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();clock();
if(!S.settings.taxas.at||Date.now()-S.settings.taxas.at>432e5)taxas().then(ok=>ok&&save(true));
</script>
