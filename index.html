<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1E2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carteira">
<title>Carteira — Controle de Ativos</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B1723;
    --bg-deep: #0F1E2B;
    --surface: #16283A;
    --surface-raised: #1E3549;
    --rule: #2A415A;
    --gold: #C6A15B;
    --gold-soft: rgba(198,161,91,.14);
    --brick: #C1503F;
    --brick-soft: rgba(193,80,63,.14);
    --cream: #EFE7D8;
    --muted: #8FA3B8;
    --dot-acoes: #6FA8DC;
    --dot-fiis: #7FB88B;
    --dot-prev: #C6A15B;
    --dot-crypto: #B98CCB;
    --dot-fgts: #5FB3B3;
    --radius: 14px;
    --radius-sm: 9px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg-deep);
    background-image:
      radial-gradient(1200px 600px at 50% -10%, rgba(198,161,91,.06), transparent 60%);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
    padding-bottom: 90px;
  }
  ::selection{ background: var(--gold-soft); }
  .mono{ font-family:'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  .display{ font-family:'Fraunces', serif; }

  /* ===== Header ===== */
  header.top{
    position: sticky; top:0; z-index: 20;
    background: rgba(15,30,43,.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--rule);
  }
  .ticker-wrap{
    overflow:hidden; white-space:nowrap; border-bottom:1px solid var(--rule);
    background: var(--bg);
  }
  .ticker-track{
    display:inline-flex; gap:36px; padding:7px 0;
    animation: scrollTicker 28s linear infinite;
  }
  .ticker-wrap:hover .ticker-track{ animation-play-state: paused; }
  @keyframes scrollTicker{
    from{ transform: translateX(0); }
    to{ transform: translateX(-50%); }
  }
  .ticker-item{ font-size:12px; color: var(--muted); display:inline-flex; align-items:center; gap:6px; padding:0 4px;}
  .ticker-item b{ color: var(--cream); font-weight:600; }
  .ticker-item .chg{ font-weight:600; }
  .up{ color:#8FCB9B; } .down{ color:#E08B7E; } .flat{ color: var(--muted); }

  .head-inner{ padding: 18px 18px 14px; }
  .head-top-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .eyebrow{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color: var(--muted); }
  .brand h1{ font-family:'Fraunces', serif; font-style:italic; font-weight:500; font-size:26px; margin:0; color:var(--cream); }
  .sync-badge{
    font-family:'Inter'; background:transparent;
    font-size:11px; color: var(--muted); border:1px solid var(--rule); border-radius: 999px;
    padding:4px 10px; display:flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .sync-badge.synced{ color:#8FCB9B; border-color: rgba(143,203,155,.35); }
  .sync-dot{ width:6px; height:6px; border-radius:50%; background: var(--muted); flex-shrink:0; }
  .sync-badge.synced .sync-dot{ background:#8FCB9B; }

  .total-row{ margin-top:14px; display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .total-value{ font-size:38px; font-weight:600; letter-spacing:-.01em; }
  .total-value small{ font-size:18px; color: var(--muted); font-weight:500; }
  .total-sub{ display:flex; gap:18px; margin-top:4px; flex-wrap:wrap;}
  .total-sub .stat{ font-size:12px; color: var(--muted); }
  .total-sub .stat b{ display:block; font-size:14px; color: var(--cream); margin-top:1px; }
  .result-pill{
    font-size:13px; font-weight:600; padding:5px 10px; border-radius:999px;
    display:inline-flex; align-items:center; gap:5px;
  }
  .result-pill.pos{ color:#8FCB9B; background: rgba(143,203,155,.12); }
  .result-pill.neg{ color:#E08B7E; background: rgba(224,139,126,.12); }

  /* Allocation donut */
  .alloc-row{ display:flex; align-items:center; gap:18px; margin-top:16px; }
  .donut{ flex-shrink:0; }
  .legend{ display:flex; flex-wrap:wrap; gap:8px 16px; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:12px; color: var(--muted); }
  .legend-item .sw{ width:8px; height:8px; border-radius:2px; }
  .legend-item b{ color: var(--cream); font-weight:600; }

  /* ===== Tabs ===== */
  nav.tabs{
    display:flex; gap:2px; padding: 4px; margin: 14px 18px 0;
    background: var(--surface); border:1px solid var(--rule); border-radius: 999px;
    position:relative; overflow-x:auto; scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{
    flex:1; min-width:max-content; background:none; border:none; color: var(--muted);
    font-family:'Inter'; font-size:13px; font-weight:600; padding:9px 14px; border-radius:999px;
    display:flex; align-items:center; gap:7px; cursor:pointer; white-space:nowrap;
    transition: color .15s ease;
  }
  .tab-btn .dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .tab-btn.active{ color: var(--bg-deep); background: var(--cream); }
  .tab-btn.active .dot{ box-shadow: none; }

  main{ padding: 16px 18px 0; max-width: 720px; margin:0 auto; }
  .panel{ display:none; animation: fadeIn .25s ease; }
  .panel.active{ display:block; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .summary-cards{ display:grid; grid-template-columns: repeat(3,1fr); gap:8px; margin-bottom:16px; }
  .card{ background: var(--surface); border:1px solid var(--rule); border-radius: var(--radius-sm); padding:12px; }
  .card .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color: var(--muted); }
  .card .value{ font-size:16px; font-weight:600; margin-top:5px; }
  .card .value.pos{ color:#8FCB9B; } .card .value.neg{ color:#E08B7E; }

  .section-head{ display:flex; justify-content:space-between; align-items:center; margin: 18px 0 8px; }
  .section-head h2{ font-family:'Fraunces', serif; font-weight:500; font-size:16px; margin:0; color: var(--cream); }
  .section-head .hint{ font-size:11px; color: var(--muted); }

  /* Position ledger rows */
  .ledger{ border:1px solid var(--rule); border-radius: var(--radius); overflow:hidden; background: var(--surface); }
  .pos-row{ border-bottom:1px solid var(--rule); }
  .pos-row:last-child{ border-bottom:none; }
  .pos-head{ display:flex; align-items:center; justify-content:space-between; padding:13px 14px; cursor:pointer; gap:10px; }
  .pos-id{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .pos-id .tk{ font-weight:600; font-size:14.5px; }
  .pos-id .sub{ font-size:11.5px; color: var(--muted); }
  .pos-nums{ text-align:right; flex-shrink:0; }
  .pos-nums .val{ font-size:14.5px; font-weight:600; }
  .pos-nums .chg{ font-size:11.5px; margin-top:2px; }
  .pos-detail{ display:none; padding:0 14px 14px; border-top:1px dashed var(--rule); }
  .pos-detail.open{ display:block; }
  .pos-detail .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0; }
  .mini-stat{ font-size:11px; color:var(--muted); }
  .mini-stat b{ display:block; font-size:13px; color:var(--cream); font-family:'IBM Plex Mono',monospace; }

  .price-edit{ display:flex; align-items:center; gap:8px; margin: 10px 0; }
  .price-edit input{ width:110px; }
  .price-edit label{ font-size:11.5px; color:var(--muted); }

  .history{ margin-top:10px; }
  .history-item{ display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--rule); font-size:12.5px; }
  .history-item:last-child{ border-bottom:none; }
  .history-item .tag{ font-size:10px; padding:2px 6px; border-radius:5px; font-weight:600; margin-right:6px; }
  .tag.compra, .tag.deposito, .tag.aporte{ background: rgba(143,203,155,.14); color:#8FCB9B; }
  .tag.venda, .tag.saque{ background: rgba(224,139,126,.14); color:#E08B7E; }
  .history-item .del{ color:var(--muted); cursor:pointer; font-size:14px; padding:0 4px; }

  .row-actions{ display:flex; gap:8px; margin-top:10px; }
  .btn-sm{ flex:1; }

  .empty{ text-align:center; padding: 40px 20px; color: var(--muted); }
  .empty .display{ font-size:17px; color: var(--cream); margin-bottom:6px; }
  .empty p{ font-size:13px; margin: 0 0 16px; line-height:1.5; }

  /* Buttons & inputs */
  button{ font-family:'Inter'; cursor:pointer; }
  .btn{
    background: var(--gold); color:#1A140A; border:none; border-radius: 999px;
    padding:10px 18px; font-weight:700; font-size:13px; letter-spacing:.01em;
  }
  .btn.ghost{ background: transparent; color: var(--cream); border:1px solid var(--rule); font-weight:600; }
  .btn.danger{ background: transparent; color:#E08B7E; border:1px solid rgba(224,139,126,.4); font-weight:600; }
  .btn:active{ transform: scale(.97); }

  .fab{
    position: fixed; right:20px; bottom:24px; z-index:30;
    width:54px; height:54px; border-radius:50%; background: var(--gold); color:#1A140A;
    border:none; font-size:26px; box-shadow: 0 8px 24px rgba(198,161,91,.35);
    display:flex; align-items:center; justify-content:center;
  }

  input, select{
    width:100%; background: var(--bg); border:1px solid var(--rule); color: var(--cream);
    border-radius: 8px; padding: 10px 11px; font-size:14px; font-family:'IBM Plex Mono', monospace;
  }
  input[type=text], select{ font-family:'Inter'; }
  input:focus, select:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  label.field{ display:block; font-size:11.5px; color: var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.06em; }
  .field-group{ margin-bottom:12px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  /* Modal */
  .overlay{
    position:fixed; inset:0; background: rgba(6,12,18,.72); z-index:50;
    display:none; align-items:flex-end; justify-content:center;
  }
  .overlay.open{ display:flex; }
  .modal{
    background: var(--surface-raised); border:1px solid var(--rule); border-radius: 18px 18px 0 0;
    width:100%; max-width:480px; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height: 88vh; overflow-y:auto; animation: slideUp .22s ease;
  }
  @keyframes slideUp{ from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .modal-head h3{ font-family:'Fraunces', serif; font-weight:500; font-size:19px; margin:0; }
  .modal-head .close{ background:none; border:none; color:var(--muted); font-size:22px; line-height:1; }
  .seg{ display:flex; gap:6px; margin-bottom:14px; background: var(--bg); padding:4px; border-radius:10px; }
  .seg button{ flex:1; background:none; border:none; color:var(--muted); font-weight:600; font-size:12.5px; padding:8px; border-radius:7px; }
  .seg button.active{ background: var(--surface); color: var(--cream); }

  @media (max-width:380px){
    .summary-cards{ grid-template-columns: 1fr 1fr; }
    .summary-cards .card:last-child{ grid-column: span 2; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="ticker-wrap"><div class="ticker-track" id="tickerTrack"></div></div>
  <div class="head-inner">
    <div class="head-top-row">
      <div class="brand">
        <span class="eyebrow">Patrimônio consolidado</span>
        <h1>Carteira</h1>
      </div>
      <button class="sync-badge" id="syncBadge" onclick="openAuthOverlay()"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">Local — entrar</span></button>
    </div>

    <div class="total-row">
      <div>
        <div class="total-value mono" id="totalValue">R$ 0<small>,00</small></div>
        <div class="total-sub">
          <div class="stat">Aportado<b class="mono" id="totalInvested">R$ 0</b></div>
          <div class="stat">Resultado<b class="mono" id="totalResultAbs">R$ 0</b></div>
        </div>
      </div>
      <span class="result-pill pos" id="totalResultPill">▲ 0,00%</span>
    </div>

    <div class="alloc-row">
      <svg class="donut" id="donut" width="76" height="76" viewBox="0 0 42 42"></svg>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="acoes"><span class="dot" style="background:var(--dot-acoes)"></span>Ações</button>
    <button class="tab-btn" data-tab="fiis"><span class="dot" style="background:var(--dot-fiis)"></span>FIIs</button>
    <button class="tab-btn" data-tab="previdencia"><span class="dot" style="background:var(--dot-prev)"></span>Previdência</button>
    <button class="tab-btn" data-tab="crypto"><span class="dot" style="background:var(--dot-crypto)"></span>Crypto</button>
    <button class="tab-btn" data-tab="fgts"><span class="dot" style="background:var(--dot-fgts)"></span>FGTS</button>
  </nav>
</header>

<main>
  <section class="panel active" id="panel-acoes"></section>
  <section class="panel" id="panel-fiis"></section>
  <section class="panel" id="panel-previdencia"></section>
  <section class="panel" id="panel-crypto"></section>
  <section class="panel" id="panel-fgts"></section>
</main>

<button class="fab" id="fabAdd">+</button>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBody"></div>
</div>

<div class="overlay" id="authOverlay">
  <div class="modal" id="authModalBody">
    <div class="modal-head"><h3>Entrar</h3><button class="close" id="authCloseBtn" onclick="closeAuthOverlay()">✕</button></div>
    <div class="seg" id="authSeg">
      <button class="active" data-mode="login" onclick="setAuthMode('login')">Entrar</button>
      <button data-mode="signup" onclick="setAuthMode('signup')">Criar conta</button>
    </div>
    <div class="field-group"><label class="field">E-mail</label><input type="email" id="auth-email" placeholder="voce@email.com" autocomplete="email"></div>
    <div class="field-group"><label class="field">Senha</label><input type="password" id="auth-senha" placeholder="••••••••" autocomplete="current-password"></div>
    <div id="authError" style="display:none; color:#E08B7E; font-size:12.5px; margin:-4px 0 12px;"></div>
    <button class="btn" style="width:100%" id="authSubmitBtn" onclick="submitAuth()">Entrar</button>
    <button class="btn ghost" style="width:100%; margin-top:8px" onclick="closeAuthOverlay()">Continuar sem login (só neste aparelho)</button>
  </div>
</div>

<script type="module" src="cloud-sync.js"></script>
<script>
/* =========================================================
   STORAGE LAYER — localStorage sempre como cache local/offline;
   quando logado, também sincroniza com o Firestore via cloud-sync.js
========================================================= */
const STORAGE_KEY = 'carteira_v1';
let CURRENT_UID = null;
let SUPPRESS_NEXT_SNAPSHOT = false; // evita re-render duplicado ao salvar o próprio snapshot

const DB = {
  async load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : defaultState();
    }catch(e){ return defaultState(); }
  },
  async save(state){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if (CURRENT_UID && window.CloudSync){
      try{
        SUPPRESS_NEXT_SNAPSHOT = true;
        await window.CloudSync.salvarNaNuvem(CURRENT_UID, state);
      }catch(e){
        console.warn('Falha ao sincronizar com a nuvem:', e);
        setSyncBadge('erro');
      }
    }
  }
};

/* =========================================================
   AUTENTICAÇÃO / SYNC NA NUVEM
========================================================= */
function setSyncBadge(mode, label){
  const badge = document.getElementById('syncBadge');
  const text = document.getElementById('syncLabel');
  if (mode === 'synced'){
    badge.classList.add('synced');
    text.textContent = label || 'Sincronizado';
  } else if (mode === 'erro'){
    badge.classList.remove('synced');
    text.textContent = 'Erro ao sincronizar';
  } else {
    badge.classList.remove('synced');
    text.textContent = 'Local — entrar';
  }
}

function openAuthOverlay(){
  const overlay = document.getElementById('authOverlay');
  const body = document.getElementById('authModalBody');
  if (CURRENT_UID){
    body.innerHTML = `
      <div class="modal-head"><h3>Sua conta</h3><button class="close" onclick="closeAuthOverlay()">✕</button></div>
      <p style="font-size:13.5px; color:var(--muted); margin-top:-6px;">Conectado como <b style="color:var(--cream)">${CURRENT_USER_EMAIL||''}</b>. Seus dados sincronizam automaticamente entre aparelhos.</p>
      <button class="btn danger" style="width:100%; margin-top:6px" onclick="doLogout()">Sair da conta</button>
    `;
  } else {
    body.innerHTML = `
      <div class="modal-head"><h3>Entrar</h3><button class="close" onclick="closeAuthOverlay()">✕</button></div>
      <div class="seg" id="authSeg">
        <button class="active" data-mode="login" onclick="setAuthMode('login')">Entrar</button>
        <button data-mode="signup" onclick="setAuthMode('signup')">Criar conta</button>
      </div>
      <div class="field-group"><label class="field">E-mail</label><input type="email" id="auth-email" placeholder="voce@email.com" autocomplete="email"></div>
      <div class="field-group"><label class="field">Senha</label><input type="password" id="auth-senha" placeholder="••••••••" autocomplete="current-password"></div>
      <div id="authError" style="display:none; color:#E08B7E; font-size:12.5px; margin:-4px 0 12px;"></div>
      <button class="btn" style="width:100%" id="authSubmitBtn" onclick="submitAuth()">Entrar</button>
      <button class="btn ghost" style="width:100%; margin-top:8px" onclick="closeAuthOverlay()">Continuar sem login (só neste aparelho)</button>
    `;
  }
  overlay.classList.add('open');
}
function closeAuthOverlay(){ document.getElementById('authOverlay').classList.remove('open'); }

let AUTH_MODE = 'login';
function setAuthMode(mode){
  AUTH_MODE = mode;
  document.querySelectorAll('#authSeg button').forEach(b=>b.classList.toggle('active', b.dataset.mode===mode));
  document.getElementById('authSubmitBtn').textContent = mode==='login' ? 'Entrar' : 'Criar conta';
}

async function submitAuth(){
  const email = document.getElementById('auth-email').value.trim();
  const senha = document.getElementById('auth-senha').value;
  const errEl = document.getElementById('authError');
  errEl.style.display = 'none';
  if (!email || !senha) { errEl.textContent = 'Preencha e-mail e senha.'; errEl.style.display='block'; return; }
  if (!window.CloudSync){ errEl.textContent = 'Sincronização ainda carregando, tente novamente em instantes.'; errEl.style.display='block'; return; }
  try{
    if (AUTH_MODE === 'login'){
      await window.CloudSync.login(email, senha);
    } else {
      await window.CloudSync.cadastrar(email, senha);
    }
    closeAuthOverlay();
  }catch(e){
    errEl.textContent = traduzErroAuth(e);
    errEl.style.display = 'block';
  }
}

function traduzErroAuth(e){
  const code = e && e.code || '';
  const map = {
    'auth/invalid-email': 'E-mail inválido.',
    'auth/user-not-found': 'Usuário não encontrado.',
    'auth/wrong-password': 'Senha incorreta.',
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/email-already-in-use': 'Esse e-mail já tem cadastro. Tente entrar.',
    'auth/weak-password': 'Senha muito curta (mínimo 6 caracteres).',
  };
  return map[code] || 'Não foi possível autenticar. Tente novamente.';
}

async function doLogout(){
  if (window.CloudSync) await window.CloudSync.logout();
  closeAuthOverlay();
}

let CURRENT_USER_EMAIL = null;

window.addEventListener('cloudsync-pronto', () => {
  window.CloudSync.onAuthStateChanged(async (user) => {
    if (window.CloudSync.pararDeOuvir) window.CloudSync.pararDeOuvir();

    if (user){
      CURRENT_UID = user.uid;
      CURRENT_USER_EMAIL = user.email;
      setSyncBadge('synced', user.email.split('@')[0]);

      const nuvem = await window.CloudSync.buscarDaNuvem(user.uid).catch(()=>null);
      if (nuvem){
        STATE = nuvem;
      } else if (STATE) {
        await DB.save(STATE); // primeira vez: sobe o que já existia localmente
      }
      renderAll();

      window.CloudSync.ouvirMudancas(user.uid, (dados) => {
        if (SUPPRESS_NEXT_SNAPSHOT){ SUPPRESS_NEXT_SNAPSHOT = false; return; }
        STATE = dados;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
        renderAll();
      });
    } else {
      CURRENT_UID = null;
      CURRENT_USER_EMAIL = null;
      setSyncBadge('local');
    }
  });
});

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

function defaultState(){
  return {
    acoes:      { positions: [], history: [] },
    fiis:       { positions: [], history: [], proventos: [] },
    previdencia:{ plans: [], aportes: [] },
    crypto:     { positions: [], history: [] },
    fgts:       { contas: [], movimentos: [] }
  };
}

let STATE = null;
let ACTIVE_TAB = 'acoes';
const OPEN_ROWS = new Set();

/* =========================================================
   FORMAT HELPERS
========================================================= */
const fmtBRL = (n) => (n<0?'-':'') + 'R$ ' + Math.abs(n).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
const fmtBRLShort = (n) => 'R$ ' + Math.abs(n).toLocaleString('pt-BR',{minimumFractionDigits:0, maximumFractionDigits:0});
const fmtPct = (n) => (n>0?'+':'') + n.toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}) + '%';
const fmtDate = (iso) => { const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`; };
const fmtNum = (n, dec=0) => n.toLocaleString('pt-BR',{minimumFractionDigits:dec, maximumFractionDigits:dec});

/* =========================================================
   DERIVED CALCS
========================================================= */
function calcPositionMetrics(pos){
  const investido = pos.qtd * pos.precoMedio;
  const atual = pos.qtd * pos.precoAtual;
  const resultado = atual - investido;
  const pct = investido > 0 ? (resultado/investido*100) : 0;
  return { investido, atual, resultado, pct };
}

function classTotals(key){
  const d = STATE[key];
  if (key === 'previdencia'){
    let saldo=0, aportado=0;
    d.plans.forEach(p=>{ saldo += p.saldoAtual||0; });
    d.aportes.forEach(a=>{ aportado += a.valor||0; });
    return { investido: aportado, atual: saldo, resultado: saldo-aportado, pct: aportado>0?((saldo-aportado)/aportado*100):0 };
  }
  if (key === 'fgts'){
    let saldo=0, depositado=0;
    d.contas.forEach(c=>{ saldo += c.saldoAtual||0; });
    d.movimentos.forEach(m=>{ if(m.tipo==='deposito') depositado += m.valor; if(m.tipo==='saque') depositado -= m.valor; });
    return { investido: depositado, atual: saldo, resultado: saldo-depositado, pct: depositado>0?((saldo-depositado)/depositado*100):0 };
  }
  let investido=0, atual=0;
  (d.positions||[]).forEach(p=>{ const m = calcPositionMetrics(p); investido+=m.investido; atual+=m.atual; });
  return { investido, atual, resultado: atual-investido, pct: investido>0?((atual-investido)/investido*100):0 };
}

function grandTotal(){
  const keys = ['acoes','fiis','previdencia','crypto','fgts'];
  let investido=0, atual=0;
  keys.forEach(k=>{ const t = classTotals(k); investido+=t.investido; atual+=t.atual; });
  return { investido, atual, resultado: atual-investido, pct: investido>0?((atual-investido)/investido*100):0, keys };
}

========================================================= */
const CLASS_META = {
  acoes:       { label:'Ações',       color:'var(--dot-acoes)',  hex:'#6FA8DC' },
  fiis:        { label:'FIIs',        color:'var(--dot-fiis)',   hex:'#7FB88B' },
  previdencia: { label:'Previdência', color:'var(--dot-prev)',   hex:'#C6A15B' },
  crypto:      { label:'Crypto',      color:'var(--dot-crypto)', hex:'#B98CCB' },

};

function renderHeader(){
  const g = grandTotal();
  const [reais, centavos] = fmtBRL(g.atual).replace('R$ ','').split(',');
  document.getElementById('totalValue').innerHTML = `R$ ${reais}<small>,${centavos||'00'}</small>`;
  document.getElementById('totalInvested').textContent = fmtBRLShort(g.investido);
  document.getElementById('totalResultAbs').textContent = (g.resultado>=0?'+':'-') + fmtBRLShort(Math.abs(g.resultado));

  const pill = document.getElementById('totalResultPill');
  pill.className = 'result-pill ' + (g.resultado>=0?'pos':'neg');
  pill.textContent = (g.resultado>=0?'▲ ':'▼ ') + fmtPct(Math.abs(g.pct)).replace('+','');

  // ticker tape
  const track = document.getElementById('tickerTrack');
  const items = g.keys.map(k=>{
    const t = classTotals(k);
    const cls = t.resultado>0?'up':t.resultado<0?'down':'flat';
    const arrow = t.resultado>0?'▲':t.resultado<0?'▼':'•';
    return `<span class="ticker-item"><b>${CLASS_META[k].label}</b>${fmtBRLShort(t.atual)}<span class="chg ${cls}">${arrow} ${fmtPct(t.pct)}</span></span>`;
  });
  track.innerHTML = items.join('') + items.join(''); // duplicated for seamless loop

  // donut
  renderDonut(g);
}

function renderDonut(g){
  const svg = document.getElementById('donut');
  const legend = document.getElementById('legend');
  const keys = g.keys.filter(k=> classTotals(k).atual > 0);
  const total = g.atual || 1;
  let offset = 0;
  const r = 15.9155;
  const circumf = 2*Math.PI*r;
  let circles = `<circle cx="21" cy="21" r="${r}" fill="none" stroke="#203247" stroke-width="6"></circle>`;
  let legendHtml = '';

  if (keys.length === 0){
    legend.innerHTML = `<div class="legend-item">Sem posições ainda</div>`;
    svg.innerHTML = circles;
    return;
  }

  keys.forEach(k=>{
    const t = classTotals(k);
    const frac = t.atual/total;
    const dash = frac*circumf;
    circles += `<circle cx="21" cy="21" r="${r}" fill="none" stroke="${CLASS_META[k].hex}" stroke-width="6"
      stroke-dasharray="${dash} ${circumf-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 21 21)" stroke-linecap="butt"/>`;
    offset += dash;
    legendHtml += `<div class="legend-item"><span class="sw" style="background:${CLASS_META[k].hex}"></span>${CLASS_META[k].label} <b>${fmtPct(frac*100).replace('+','')}</b></div>`;
  });
  svg.innerHTML = circles;
  legend.innerHTML = legendHtml;
}

async function persist(){ await DB.save(STATE); renderAll(); }

function updatePrice(key, posId){
  const input = document.getElementById('price-'+posId);
  const val = parseFloat(input.value);
  if (isNaN(val) || val < 0) return;
  const pos = STATE[key].positions.find(p=>p.id===posId);
  pos.precoAtual = val;
  persist();
}

function updateSaldoPrevidencia(planId){
  const input = document.getElementById('saldo-'+planId);
  const val = parseFloat(input.value);
  if (isNaN(val) || val < 0) return;
  STATE.previdencia.plans.find(p=>p.id===planId).saldoAtual = val;
  persist();
}

function updateSaldoFgts(contaId){
  const input = document.getElementById('saldo-'+contaId);
  const val = parseFloat(input.value);
  if (isNaN(val) || val < 0) return;
  STATE.fgts.contas.find(c=>c.id===contaId).saldoAtual = val;
  persist();
}

function deletePosition(key, id){
  if (!confirm('Excluir este item e todo o histórico associado?')) return;
  if (key==='previdencia'){
    STATE.previdencia.plans = STATE.previdencia.plans.filter(p=>p.id!==id);
    STATE.previdencia.aportes = STATE.previdencia.aportes.filter(a=>a.planId!==id);
  } else if (key==='fgts'){
    STATE.fgts.contas = STATE.fgts.contas.filter(c=>c.id!==id);
    STATE.fgts.movimentos = STATE.fgts.movimentos.filter(m=>m.contaId!==id);
  } else {
    STATE[key].positions = STATE[key].positions.filter(p=>p.id!==id);
    STATE[key].history = STATE[key].history.filter(h=>h.positionId!==id);
  }
  persist();
}

function deleteTx(key, txId){
  if (key==='previdencia'){
    const ap = STATE.previdencia.aportes.find(a=>a.id===txId);
    STATE.previdencia.aportes = STATE.previdencia.aportes.filter(a=>a.id!==txId);
  } else if (key==='fgts'){
    STATE.fgts.movimentos = STATE.fgts.movimentos.filter(m=>m.id!==txId);
  } else {
    const h = STATE[key].history.find(x=>x.id===txId);
    if (h) recalcAfterTxRemoval(key, h);
    STATE[key].history = STATE[key].history.filter(x=>x.id!==txId);
  }
  persist();
}

// Recompute weighted-average price for a position based on remaining history
function recalcPositionFromHistory(key, positionId){
  const hist = STATE[key].history.filter(h=>h.positionId===positionId).sort((a,b)=>a.data.localeCompare(b.data)||a.id.localeCompare(b.id));
  let qtd = 0, precoMedio = 0;
  hist.forEach(h=>{
    if (h.tipo === 'compra'){
      const novoQtd = qtd + h.qtd;
      precoMedio = novoQtd>0 ? ((qtd*precoMedio) + (h.qtd*h.preco)) / novoQtd : 0;
      qtd = novoQtd;
    } else { // venda
      qtd = Math.max(0, qtd - h.qtd);
      if (qtd === 0) precoMedio = 0;
    }
  });
  const pos = STATE[key].positions.find(p=>p.id===positionId);
  if (pos){ pos.qtd = qtd; pos.precoMedio = precoMedio; }
}
function recalcAfterTxRemoval(key, removedTx){
  // simplest correct approach: recompute fully from remaining history after removal
  setTimeout(()=>recalcPositionFromHistory(key, removedTx.positionId), 0);
}

    <div class="field-row">
      <div class="field-group"><label class="field">Quantidade</label><input type="number" step="any" id="f-qtd" placeholder="0"></div>
      <div class="field-group"><label class="field">Preço de compra</label><input type="number" step="0.01" id="f-preco" placeholder="0,00"></div>
    </div>
    <div class="field-group"><label class="field">Data da compra</label><input type="date" id="f-data" value="${todayISO()}"></div>
    <button class="btn" style="width:100%" onclick="submitAddPosition('${key}')">Adicionar posição</button>
  `);
}

function submitAddPosition(key){
  const ticker = document.getElementById('f-ticker').value.trim().toUpperCase();
  const qtd = parseFloat(document.getElementById('f-qtd').value);
  const preco = parseFloat(document.getElementById('f-preco').value);
  const data = document.getElementById('f-data').value || todayISO();
  if (!ticker || !qtd || !preco) return alert('Preencha todos os campos.');

  let pos = STATE[key].positions.find(p=>p.ticker===ticker);
  if (!pos){
    pos = { id: uid(), ticker, qtd:0, precoMedio:0, precoAtual: preco };
    STATE[key].positions.push(pos);
  }
  STATE[key].history.push({ id: uid(), positionId: pos.id, tipo:'compra', qtd, preco, data });
  recalcPositionFromHistory(key, pos.id);
  pos.precoAtual = preco;
  closeModal();
  persist();
}

function submitAddPrevidencia(){
  const nome = document.getElementById('f-nome').value.trim();
  const inst = document.getElementById('f-inst').value.trim();
  const saldo = parseFloat(document.getElementById('f-saldo').value) || 0;
  if (!nome) return alert('Dê um nome ao plano.');
  STATE.previdencia.plans.push({ id: uid(), nome, instituicao: inst||'—', saldoAtual: saldo });
  closeModal();
  persist();
}

function submitAddFgts(){
  const emp = document.getElementById('f-emp').value.trim();
  const saldo = parseFloat(document.getElementById('f-saldo').value) || 0;
  if (!emp) return alert('Informe o empregador.');
  STATE.fgts.contas.push({ id: uid(), empregador: emp, saldoAtual: saldo });
  closeModal();
  persist();
}

function openTxModal(key, refId, tipo){
  const titles = { compra:'Registrar compra', venda:'Registrar venda', aporte:'Registrar aporte', deposito:'Registrar depósito', saque:'Registrar saque' };
  if (key==='previdencia' || key==='fgts'){
    openModal(`
      <div class="modal-head"><h3>${titles[tipo]}</h3><button class="close" onclick="closeModal()">✕</button></div>
      <div class="field-group"><label class="field">Valor</label><input type="number" step="0.01" id="f-valor" placeholder="0,00"></div>
      <div class="field-group"><label class="field">Data</label><input type="date" id="f-data" value="${todayISO()}"></div>
      <button class="btn" style="width:100%" onclick="submitTx('${key}','${refId}','${tipo}')">Salvar</button>
    `);
    return;
  }
  openModal(`
    <div class="modal-head"><h3>${titles[tipo]}</h3><button class="close" onclick="closeModal()">✕</button></div>
    <div class="field-row">
      <div class="field-group"><label class="field">Quantidade</label><input type="number" step="any" id="f-qtd" placeholder="0"></div>
      <div class="field-group"><label class="field">Preço unitário</label><input type="number" step="0.01" id="f-preco" placeholder="0,00"></div>
    </div>
    <div class="field-group"><label class="field">Data</label><input type="date" id="f-data" value="${todayISO()}"></div>
    <button class="btn" style="width:100%" onclick="submitTx('${key}','${refId}','${tipo}')">Salvar</button>
  `);
}

function submitTx(key, refId, tipo){
  const data = document.getElementById('f-data').value || todayISO();

  if (key==='previdencia'){
    const valor = parseFloat(document.getElementById('f-valor').value);
    if (!valor) return alert('Informe o valor.');
    STATE.previdencia.aportes.push({ id: uid(), planId: refId, valor, data });
    const plan = STATE.previdencia.plans.find(p=>p.id===refId);
    plan.saldoAtual = (plan.saldoAtual||0) + valor;
    closeModal(); persist(); return;
  }
  if (key==='fgts'){
    const valor = parseFloat(document.getElementById('f-valor').value);
    if (!valor) return alert('Informe o valor.');
    STATE.fgts.movimentos.push({ id: uid(), contaId: refId, tipo, valor, data });
    const conta = STATE.fgts.contas.find(c=>c.id===refId);
    conta.saldoAtual = tipo==='deposito' ? (conta.saldoAtual||0)+valor : Math.max(0,(conta.saldoAtual||0)-valor);
    closeModal(); persist(); return;
  }

  const qtd = parseFloat(document.getElementById('f-qtd').value);
  const preco = parseFloat(document.getElementById('f-preco').value);
  if (!qtd || !preco) return alert('Preencha todos os campos.');
  const pos = STATE[key].positions.find(p=>p.id===refId);
  if (tipo==='venda' && qtd > pos.qtd) return alert('Quantidade maior que a posição atual.');
  STATE[key].history.push({ id: uid(), positionId: refId, tipo, qtd, preco, data });
  recalcPositionFromHistory(key, refId);
  if (tipo==='compra') pos.precoAtual = preco;
  closeModal(); persist();
}

/* =========================================================
   TABS + FAB
========================================================= */
document.getElementById('tabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  ACTIVE_TAB = btn.dataset.tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b===btn));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+ACTIVE_TAB).classList.add('active');
});

document.getElementById('fabAdd').addEventListener('click', ()=> openAddModal(ACTIVE_TAB));

/* =========================================================
   PWA install (service worker)
========================================================= */
if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

/* =========================================================
   INIT
========================================================= */
(async function init(){
  STATE = await DB.load();
  renderAll();
})();
</script>
</body>
</html>
